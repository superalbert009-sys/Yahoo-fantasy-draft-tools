      total = df.map((_, i) => (valid[i] ? sum(cats.map((_c, ci) => z[ci][i])) : null));
      const ranked = validIdx.slice().sort((a, b) => total[b] - total[a]).slice(0, Math.min(poolN, validIdx.length));
      const same = ranked.length === pool.length && ranked.every((i) => pool.includes(i));
      if (same) break;
      pool = ranked;
    }

    // (1) 基礎分數 → (2) 出勤調整 (§7,sign-safe,C2 可調強度) → (3) 聯盟位置稀缺 (§8,C3)
    df.forEach((p, i) => {
      p.valid = valid[i];
      p.zv = valid[i] ? cats.map((_c, ci) => z[ci][i]) : null;
      p.zTotal = valid[i] ? total[i] : null;
      p.baseScore = p.zTotal;
      p.gpFactor = Math.min((isNum(p.gp) ? p.gp : cfg.gpRef) / cfg.gpRef, 1);   // 僅供「出賽偏少」提示,不再進估值
      p.availMult = HM.effectiveAvailability(p.availabilityMultiplier, cfg.availStrength);
      p.riskScore = valid[i] ? HM.applyAvailability(total[i], p.availMult) : null;
      p.posSet = expandPositions(p.pos);
      p.assignmentLoss = 0; p.scarcityBonus = 0;
    });
    // C3 / C4:專屬位置名額 = 隊數 × 每隊該位置名額;UTIL / BN / IL 不產生稀缺。
    const DEDICATED = ['PG', 'SG', 'G', 'SF', 'PF', 'F', 'C'];
    const slotCaps = {};
    DEDICATED.forEach((pos) => { const n = settings.rosterSlots[pos] || 0; if (n > 0) slotCaps[pos] = n * nTeams; });
    const validRows = df.filter((p) => p.valid);
    const withPos = validRows.filter((p) => DEDICATED.some((pos) => slotCaps[pos] && p.posSet.has(pos))).length;
    let scarcity = { applied: false, reason: '' };
    if (!Object.keys(slotCaps).length) scarcity.reason = '陣容沒有專屬位置名額 (例如全部是 UTIL),不做聯盟位置稀缺調整。';
    else if (withPos < validRows.length * 0.5) scarcity.reason = `只有 ${withPos}/${validRows.length} 名球員有位置資料,已跳過聯盟位置稀缺調整 (建議 CSV 加入 Pos 欄)。`;
    else {
      const res = HM.computeLeagueScarcity(validRows.map((p) => ({ id: p.pid, eligible: p.posSet, score: p.riskScore })), slotCaps);
      validRows.forEach((p) => { p.assignmentLoss = res.losses.get(p.pid) || 0; p.scarcityBonus = cfg.scarcityWeight * p.assignmentLoss; });
      scarcity = { applied: true, filled: res.filled, totalSlots: res.totalSlots, feasible: res.feasible, infeasibleIds: res.infeasibleIds };
      if (!res.feasible) scarcity.reason = `專屬位置名額 ${res.totalSlots} 個,合格球員只能填滿 ${res.filled} 個;部分位置深度不足,稀缺加成可能偏高。`;
    }
    if (scarcity.reason) notes.push(scarcity.reason);
    df.forEach((p) => { p.value = p.valid ? p.riskScore + p.scarcityBonus : null; });

    // (4) 替補線 (C4):完整名額池 = 隊數 × 每隊總名額 (先發含 UTIL/G/F + 板凳,不含 IL)
    const ranked = validRows.map((p) => p.value).sort((a, b) => b - a);
    const nPool = nTeams * rosterSize(settings);
    const replZ = ranked.length ? ranked[Math.min(nPool, ranked.length - 1)] : 0;
    const starterLine = ranked.length ? ranked[Math.min(nTeams * nActive, ranked.length - 1)] : 0;   // 先發線 (run 偵測的「先發級」門檻)
    const varSum = sum(ranked.map((v) => Math.max(v - replZ, 0)));
    const poolMoney = nTeams * (settings.budget - rosterSize(settings) * settings.minBid);
    const k = varSum > 0 ? poolMoney / varSum : 0;
    const model = {
      cats, k, replZ, nPool, starterLine, slotCaps, scarcity, minBid: settings.minBid, availStrength: cfg.availStrength, baselines: base, notes, settings,
      catStats: cats.map((c, i) => ({ key: c.key, label: c.label, mu: catMu[i], sd: catSd[i], higherBetter: c.higherBetter })),
      toDollars(zz) { return this.minBid + Math.max(zz - this.replZ, 0) * this.k; },
      /** 個人化分數用的出勤調整 (與全域同一套係數,不重複計算)。 */
      riskAdjust(zz, availMult) { return HM.applyAvailability(zz, availMult); },
    };
    df.forEach((p) => {
      p.dollars = p.valid ? model.toDollars(p.value) : null;
      p.aboveRepl = p.valid ? p.value - replZ : null;   // UI 顯示用,避免在 UI 層自行相減
      // Phase 3 風險分層 (C8:傷病 status 只顯示,不進任何一層)。三層的稀缺加成相同,差別只在出勤調整。
      //   base         = 不做出勤調整
      //   availability = 只依歷史出勤 (不含手動調整)
      //   risk         = 再加上使用者明確輸入的手動 GP 調整 = 實際定價用的 value / dollars
      if (!p.valid) { p.valueTiers = null; return; }
      // 經由管線時一定有 historicalAvailabilityMultiplier (可能為 null = 沒有歷史);直接呼叫 buildModel 時沒有,就退回 availabilityMultiplier
      const histMult = p.historicalAvailabilityMultiplier !== undefined ? p.historicalAvailabilityMultiplier : p.availabilityMultiplier;
      const availScore = HM.applyAvailability(p.baseScore, HM.effectiveAvailability(histMult, cfg.availStrength));
      const tier = (score, source) => ({ score, dollars: model.toDollars(score + p.scarcityBonus), source });
      p.valueTiers = {
        base: tier(p.baseScore, 'calculated'),
        availability: tier(availScore, 'calculated'),
        risk: tier(p.riskScore, p.manualGpAdjustment ? 'calculated + user override' : 'calculated'),
      };
    });
    df.sort((a, b) => (b.valid ? b.value : -Infinity) - (a.valid ? a.value : -Infinity));
    df.forEach((p, i) => { p.rank = p.valid ? i + 1 : null; });
    model.players = df;
    model.byId = new Map(df.map((p) => [p.pid, p]));
    model.bySid = new Map(df.map((p) => [p.sid, p]));
    model.identity = identity;
    model.modelVersion = VALUATION_MODEL_VERSION; model.decisionVersion = DECISION_MODEL_VERSION;
    model.configFingerprint = null;   // 由 buildValuationPipeline 填入 (需要原始資料)
    return model;
  }

  // ------------------------------------------------------------------ 選秀狀態
  class DraftState {
    constructor(settings, model, teams, myKey) {
      this.settings = settings; this.model = model; this.teams = teams; this.myKey = myKey; this.picks = [];
      this.overrides = {};   // Phase 4:{ [sid]: { valueAdjustment, gpAdjustment, targetPrice, doNotDraft, priority } }
      this.currentAuction = null;   // Phase 4 (C10)
      this.cfg = null;              // 快照計算「我的」個人化價值時使用;未設定時用預設值
      this.snapshotsEnabled = true; // 模擬用的複本會關閉 (快照只用於真實成交)
    }
    get(pid) { return this.model.byId.get(pid); }
    teamName(key) { const t = this.teams.find((x) => x.key === key); return t ? t.name : key; }
    draftedIds() { return new Set(this.picks.map((p) => p.pid)); }
    roster(key) { return this.picks.filter((p) => p.teamKey === key); }
    myIds() { return this.roster(this.myKey).map((p) => p.pid); }
    available() { const d = this.draftedIds(); return this.model.players.filter((p) => p.valid && !d.has(p.pid)); }
    spent(key) { return sum(this.roster(key).map((p) => p.price)); }
    budgetLeft(key) { return this.settings.budget - this.spent(key); }
    openSpots(key) { return Math.max(rosterSize(this.settings) - this.roster(key).length, 0); }
    maxBid(key) {
      const spots = this.openSpots(key);
      if (spots <= 0) return 0;
      return Math.max(Math.trunc(this.budgetLeft(key) - (spots - 1) * this.settings.minBid), 0);
    }
    inflation() {
      if (!this.settings.isAuction) return 1;
      const mb = this.settings.minBid;
      const cash = sum(this.teams.map((t) => Math.max(this.budgetLeft(t.key) - this.openSpots(t.key) * mb, 0)));
      const nOpen = sum(this.teams.map((t) => this.openSpots(t.key)));
      const top = this.available().map((p) => p.dollars).sort((a, b) => b - a).slice(0, Math.max(nOpen, 1));
      const val = sum(top.map((d) => Math.max(d - mb, 0)));
      return val <= 0 ? 1 : clip(cash / val, 0.4, 3.0);
    }
    picksMade() { return this.picks.length; }
    ensurePlayer(pid) {
      if (this.model.byId.has(pid)) return;
      const p = { pid, name: `未知球員(${pid})`, team: '', pos: [], status: '', valid: false, zv: null, value: null, dollars: null, posSet: new Set(), gpFactor: 1, rank: null };
      p.sid = sourceKeyOf(pid) || 'pid:' + pid; p.nameKey = null; p.sidBasis = 'placeholder';
      this.model.players.push(p); this.model.byId.set(pid, p);
      if (this.model.bySid && !this.model.bySid.has(p.sid)) this.model.bySid.set(p.sid, p);
    }
    getBySid(sid) { return this.model.bySid ? this.model.bySid.get(sid) : undefined; }
    // ---------------- Phase 4 (C10):進行中的拍賣 (Snake 時只記錄目前考慮的球員)
    startAuction(pid, opts) {
      opts = opts || {};
      if (this.draftedIds().has(pid)) throw new Error('該球員已被選走');
      this.ensurePlayer(pid);
      this.currentAuction = { pid, sid: this.get(pid).sid, nominatedBy: opts.nominatedBy || null, currentBid: null, highBidder: null,
        bids: [], startedAtPick: this.picks.length, status: 'open' };
      if (this.settings.isAuction && opts.nominatedBy && isNum(Number(opts.openingBid)) && opts.openingBid != null) this.placeBid(opts.nominatedBy, opts.openingBid);
      return this.currentAuction;
    }
    /** 出價必須高於目前叫價;超過該隊合法最高出價只警告不阻擋 (這裡是真實拍賣的鏡像紀錄,合法與否由 Yahoo 判定)。 */
    placeBid(teamKey, amount) {
      const a = this.currentAuction;
      if (!a) throw new Error('目前沒有進行中的拍賣');
      if (!this.settings.isAuction) throw new Error('Snake 選秀沒有出價');
      amount = Number(amount);
      if (!isNum(amount) || amount < this.settings.minBid) throw new Error(`出價至少 ${this.settings.minBid}`);
      if (a.currentBid != null && amount <= a.currentBid) throw new Error(`出價必須高於目前叫價 ${a.currentBid}`);
      const warnings = [];
      if (this.openSpots(teamKey) <= 0) warnings.push(`${this.teamName(teamKey)} 名額已滿`);
      else if (amount > this.maxBid(teamKey)) warnings.push(`${this.teamName(teamKey)} 出價 ${amount} 超過其最高可出 ${this.maxBid(teamKey)}`);
      a.bids.push({ teamKey, amount, seq: a.bids.length + 1 });
      a.currentBid = amount; a.highBidder = teamKey;
      return { ok: true, warnings };
    }
    undoBid() {
      const a = this.currentAuction;
      if (!a || !a.bids.length) return null;
      const b = a.bids.pop(), last = a.bids[a.bids.length - 1];
      a.currentBid = last ? last.amount : null; a.highBidder = last ? last.teamKey : null;
      return b;
    }
    cancelAuction() { const a = this.currentAuction; this.currentAuction = null; return a; }
    /** 拍賣:由最高出價者以目前叫價成交;Snake:需指定隊伍 (通常是輪到的隊伍),價格 0。 */
    completeAuction(teamKey) {
      const a = this.currentAuction;
      if (!a) throw new Error('目前沒有進行中的拍賣');
      let team, price;
      if (this.settings.isAuction) {
        if (!a.highBidder) throw new Error('沒有任何出價,無法成交');
        team = a.highBidder; price = a.currentBid;
      } else {
        if (!teamKey) throw new Error('Snake 成交需要指定隊伍');
        team = teamKey; price = 0;
      }
      const pk = this.addPick(a.pid, team, price, 'live');
      this.currentAuction = null;
      return pk;
    }
    /**
     * Phase 4 Calibration 快照:在「這一手寫入之前」記錄模型值與預期成交價 (通膨隨每手改變,必須當下記錄)。
     * 價格區間以「占總預算比例」切分,任何預算的聯盟都適用。沒有估值的球員 (新秀、佔位) 回傳 null。
     */
    snapshotFor(pid, teamKey) {
      const p = this.get(pid), S = this.settings;
      if (!p || !p.valid || !isNum(p.dollars)) return null;
      const cfg = this.cfg || defaultCfg();
      let personalValue = null, myMaxBid = null;
      const rec = evaluate(this, cfg, buildContext(this, cfg), pid);   // 唯讀:以「這一手之前」的狀態計算我的觀點
      if (rec) { personalValue = rec.decisionWorth; myMaxBid = S.isAuction ? rec.ceiling : null; }
      const ov = overrideFor(this, p);
      const expected = expectedPrice(S, p.dollars, this.inflation());
      const nT = S.numTeams, nAct = activeSlots(S).length, total = nT * rosterSize(S);
      const B = S.budget || 200, cut = CALIBRATION.priceCuts.map((f) => Math.round(B * f));
      const priceRange = expected < cut[0] ? `$${S.minBid}–${cut[0] - 1}` : expected < cut[1] ? `$${cut[0]}–${cut[1] - 1}` : expected < cut[2] ? `$${cut[1]}–${cut[2] - 1}` : `$${cut[2]}+`;
      const tier = p.rank <= nT * 3 ? `前 ${nT * 3} 名` : (p.rank <= nT * nAct ? '先發級' : '板凳級');
      const frac = this.picks.length / Math.max(total, 1);
      let topCat = null;
      if (p.zv) { let bi = 0; p.zv.forEach((z, i) => { if (z > p.zv[bi]) bi = i; }); topCat = this.model.cats[bi].label; }
      return {
        modelVersion: VALUATION_MODEL_VERSION, decisionVersion: DECISION_MODEL_VERSION,
        configFingerprint: this.model.configFingerprint || null, personalFingerprint: personalFingerprint(cfg), timestamp: new Date().toISOString(),
        playerValue: p.value, fairValue: p.dollars, marketValue: expected, personalValue, maxBid: myMaxBid,
        buyerLegalMax: teamKey && S.isAuction ? this.maxBid(teamKey) : null,
        override: ov ? Object.assign({}, ov) : null,
        // Phase 4 既有欄位 (保留,相容舊紀錄):modelDollars = fairValue、expectedPrice = marketValue
        sid: p.sid, modelDollars: p.dollars, expectedPrice: expected, rank: p.rank, primaryPos: (p.pos || [])[0] || null,
        tier, priceRange, stage: frac < 1 / 3 ? '前段' : (frac < 2 / 3 ? '中段' : '後段'), topCat, at: this.picks.length,
      };
    }
    /**
     * 還原選秀紀錄 (C9):有 sid 就依 sid 找球員 (pid 若改變會重新綁定);沒有 sid 的舊紀錄照 pid;
     * 都找不到就建立佔位球員。回傳 { rebound, placeholders }。
     */
    restorePicks(picks) {
      let rebound = 0, placeholders = 0;
      (picks || []).forEach((raw) => {
        const pk = Object.assign({}, raw);
        const bySid = pk.sid ? this.getBySid(pk.sid) : null;
        if (bySid) {                       // 同一個 sid = 同一個人;pid 改變就重新綁定
          if (bySid.pid !== pk.pid) { pk.pid = bySid.pid; rebound++; }
        } else if (!this.model.byId.has(pk.pid)) { this.ensurePlayer(pk.pid); placeholders++; }
        if (!pk.sid) pk.sid = this.get(pk.pid).sid;
        this.picks.push(pk);
      });
      return { rebound, placeholders };
    }
    addPick(pid, teamKey, price, source) {
      if (this.draftedIds().has(pid)) throw new Error('該球員已被選走');
      this.ensurePlayer(pid);
      const snap = this.snapshotsEnabled === false ? null : this.snapshotFor(pid, teamKey);
      const p = { pid, sid: this.get(pid).sid, teamKey, price: Number(price) || 0, pickNo: this.picks.length + 1, source: source || 'manual', snap };
      this.picks.push(p); return p;
    }
    removePick(pid) {
      const i = this.picks.findIndex((p) => p.pid === pid);
      return i >= 0 ? this.picks.splice(i, 1)[0] : null;
    }
    undo() { return this.picks.pop() || null; }
    /** 合併 Yahoo 選秀結果 [{pickNo, teamKey, playerKey, cost}]。回傳 [{kind, pick}] */
    mergeRemote(results) {
      const changes = [], byPid = new Map(this.picks.map((p) => [p.pid, p])), remote = new Set();
      for (const r of results.slice().sort((a, b) => a.pickNo - b.pickNo)) {
        const price = Number.isFinite(r.cost) ? r.cost : 0;
        remote.add(r.playerKey);
        const p = byPid.get(r.playerKey);
        if (p) {
          const changed = p.teamKey !== r.teamKey || Math.abs(p.price - price) > 1e-6;
          if (changed || p.source !== 'yahoo') {
            p.teamKey = r.teamKey; p.price = price; p.source = 'yahoo'; p.pickNo = r.pickNo;
            if (changed) changes.push({ kind: 'updated', pick: p });
          }
        } else {
          this.ensurePlayer(r.playerKey);
          const snap = this.snapshotFor(r.playerKey, r.teamKey);   // 依選秀順序逐筆快照:用前面幾手成交後的狀態
          const np = { pid: r.playerKey, sid: this.get(r.playerKey).sid, teamKey: r.teamKey, price, pickNo: r.pickNo, source: 'yahoo', snap };
          this.picks.push(np); changes.push({ kind: 'new', pick: np });
        }
      }
      for (const p of this.picks.slice()) {
        if (p.source === 'yahoo' && !remote.has(p.pid)) { this.picks.splice(this.picks.indexOf(p), 1); changes.push({ kind: 'removed', pick: p }); }
      }
      this.picks.sort((a, b) => (a.pickNo || 1e9) - (b.pickNo || 1e9));
      const cur = this.currentAuction;
      if (cur && this.draftedIds().has(cur.pid)) {
        this.currentAuction = null;
        changes.push({ kind: 'auctionClosed', pick: this.picks.find((pk) => pk.pid === cur.pid), auction: cur });
      }
      return changes;
    }
  }

  // ------------------------------------------------------------------ 推薦
  const isPunt = (c, cfg) => (cfg.puntCats || []).some((x) => String(x).toUpperCase() === c.label.toUpperCase() || String(x).toUpperCase() === c.key.toUpperCase());
  const dot = (a, w) => { let s = 0; for (let i = 0; i < w.length; i++) s += (a[i] || 0) * w[i]; return s; };

  function nextMyPicks(state, cfg) {
    const me = state.teams.find((t) => t.key === state.myKey);
    const slot = cfg.myDraftSlot || (me && me.draftPosition);
    const n = state.settings.numTeams;
    if (!slot || state.settings.isAuction) return null;
    const mine = [];
    for (let p = state.picksMade() + 1; p <= state.picksMade() + 4 * n + 1; p++) {
      const r = Math.floor((p - 1) / n), i = (p - 1) % n;
      if ((r % 2 === 0 ? i + 1 : n - i) === slot) { mine.push(p); if (mine.length === 2) return [mine[0], mine[1]]; }
    }
    return null;
  }

  /** 類別需求向量 (我方與對手共用同一公式):陣容某類別平均 z 越低,需求越高;前 5 人逐步增加可信度。 */
  function categoryNeed(state, pids) {
    const cats = state.model.cats, n = pids.length;
    if (!n) return cats.map(() => 0);
    const tz = cats.map((_c, i) => sum(pids.map((pid) => { const p = state.get(pid); return p && p.zv ? p.zv[i] : 0; })));
    return tz.map((t) => clip(-t / n, -1, 1) * Math.min(n / 5, 1));
  }

  function buildContext(state, cfg) {
    const m = state.model, cats = m.cats, S = state.settings;
    const base = cats.map((c) => (isPunt(c, cfg) ? 0 : (cfg.catWeights && cfg.catWeights[c.label] != null ? Number(cfg.catWeights[c.label]) : 1)));
    const my = state.myIds();
    const need = categoryNeed(state, my);
    base.forEach((b, i) => { if (b === 0) need[i] = 0; });
    let w = base.map((b, i) => Math.max(b * (1 + cfg.needBeta * need[i]), 0));
    const sw = sum(w);
    if (sw > 0) { const nb = base.filter((b) => b > 0).length; w = w.map((x) => (x * nb) / sw); }

    const active = activeSlots(S);
    const myPos = my.map((pid) => state.get(pid).posSet);
    const matched = maxMatch(active, myPos), unfilled = active.length - matched;
    const personal = (p) => (p && p.valid && p.zv ? m.riskAdjust(dot(p.zv, w), p.availMult) : null);
    let floor = -Infinity;   // 舊版「先發已滿時的最弱球員」;保留欄位供相容,worth 已改用陣容邊際價值
    if (my.length && unfilled === 0) floor = Math.min(...my.map((pid) => { const v = personal(state.get(pid)); return v == null ? 0 : v; }));
    const avail = state.available();
    const srt = avail.map((p) => personal(p)).sort((a, b) => b - a);
    const nOpen = sum(state.teams.map((t) => state.openSpots(t.key)));
    // C4:個人化替補線與全域一致,採完整剩餘名額 (而不是只算先發比例)
    const R = clip(nOpen, 1, Math.max(srt.length - 1, 1));
    const replP = srt.length ? srt[Math.min(R, srt.length - 1)] : m.replZ;
    const varSum = sum(srt.slice(0, R).map((v) => Math.max(v - replP, 0)));
    const mb = S.minBid;
    const cash = sum(state.teams.map((t) => Math.max(state.budgetLeft(t.key) - state.openSpots(t.key) * mb, 0)));
    const kP = varSum > 0 && S.isAuction ? cash / varSum : m.k;

    // C5:陣容價值 = 我方陣容 (相對個人替補線的分數) 以加權最佳指派排進先發名額 (含 UTIL/G/F) + benchWeight × 板凳
    const rosterCaps = {};
    active.forEach((slot) => { rosterCaps[slot] = (rosterCaps[slot] || 0) + 1; });
    const benchWeight = isNum(cfg.benchWeight) ? Math.max(cfg.benchWeight, 0) : 0;
    const toEntry = (p) => {
      const v = personal(p);
      const eligible = new Set(p.posSet); eligible.add('UTIL');
      return { id: p.pid, eligible, rel: v == null ? 0 : v - replP };   // 沒有估值的球員 (例如新秀) 視為替補級 (0)
    };
    const rosterEntries = my.map((pid) => toEntry(state.get(pid)));
    const rosterNow = HM.rosterAssignmentValue(rosterEntries, rosterCaps, benchWeight, benchSlots(S));
    return {
      w, need, myPos, active, matchedNow: matched, unfilled, spots: state.openSpots(state.myKey), maxBid: state.maxBid(state.myKey),
      infl: state.inflation(), nextPick: nextMyPicks(state, cfg), picksMade: state.picksMade(), floor, replP, kP, cats,
      rosterCaps, rosterEntries, rosterValueNow: rosterNow.total, benchWeight, toEntry,
      survivalRef: survivalReference(state, cfg),
    };
  }

  /** C5:把候選人加入我方陣容後,陣容價值增加多少 (分數單位)。純函式,供 evaluate 與其他服務共用。 */
  function marginalRosterValue(state, ctx, pid) {
    const p = state.get(pid);
    if (!p || !p.valid) return null;
    const withP = HM.rosterAssignmentValue(ctx.rosterEntries.concat([ctx.toEntry(p)]), ctx.rosterCaps, ctx.benchWeight, benchSlots(state.settings));
    return Math.max(withP.total - ctx.rosterValueNow, 0);
  }

  function strategyParams(cfg, market) {
    if (cfg.strategy === 'stars_scrubs') {
      if (market >= 30) return [0.92, 0.12];
      if (market >= 8) return [0.75, 0.0];
      return [1.0, 0.0];
    }
    return [0.90, 0.05];
  }

  /**
   * opts.lite = true:只算排名需要的 score / decisionScore / doNotDraft,在計算陣容邊際價值之前返回
   * (Snake 的推薦排序只看 decisionScore,不用 MRV;模擬大量重複時使用,結果與完整計算的排序完全相同)。
   */
  function evaluate(state, cfg, ctx, pid, opts) {
    const m = state.model, S = state.settings, row = state.get(pid);
    if (!row || !row.valid) return null;
    const z = row.zv;
    const raw = dot(z, ctx.w), adj = m.riskAdjust(raw, row.availMult);

    const gain = maxMatch(ctx.active, ctx.myPos.concat([row.posSet])) - ctx.matchedNow;
    const forced = ctx.spots - ctx.unfilled <= 0;
    if (forced && gain === 0) return null;
    let posAdj = 0;
    if (ctx.unfilled > 0) posAdj = gain ? 0.15 : (ctx.spots > ctx.unfilled + 1 ? -0.6 : -3.0);
    const score = adj + posAdj;
    // Phase 4 Manual Override:只作用在決策層 (模型值 + 使用者調整 = 最終決策值),不覆寫 worth 與全域價值
    const ov = overrideFor(state, row);
    const valueAdj = ov && isNum(ov.valueAdjustment) ? ov.valueAdjustment : 0;
    const decisionScore = score + (valueAdj && ctx.kP > 0 ? valueAdj / ctx.kP : 0);
    if (opts && opts.lite) return { pid, score, decisionScore, doNotDraft: !!(ov && ov.doNotDraft), lite: true };

    // C5:對我的價值由「陣容邊際價值」決定 —— 位置重疊、只能擠掉較強隊友時,價值會自然下降
    const mrv = marginalRosterValue(state, ctx, pid);
    const worth = S.minBid + mrv * ctx.kP;
    const decisionWorth = Math.max(S.minBid, worth + valueAdj);
    const market = row.dollars, fair = expectedPrice(S, market, ctx.infl);
    const [tf, margin] = strategyParams(cfg, market);

    const rec = {
      pid, name: row.name, team: row.team || '', pos: (row.pos || []).join('/'), status: row.status || '', score,
      var: score - ctx.replP, market, fair, worth, target: null, ceiling: null, mrv,
      survival: S.isAuction ? null : estimateSurvival(state, cfg, pid, ctx.survivalRef),
      decisionWorth, decisionScore,
      doNotDraft: !!(ov && ov.doNotDraft), priority: (ov && ov.priority) || 'normal',
      override: ov ? { matchedBy: ov.matchedBy, applied: ['valueAdjustment', 'gpAdjustment', 'targetPrice', 'doNotDraft', 'priority'].filter((k) => ov[k] != null && ov[k] !== 0 && ov[k] !== false && ov[k] !== 'normal' && ov[k] !== '') } : null,
      adp: isNum(row.adp) ? row.adp : null, tag: '', reasons: [], gain, contrib: z.map((v, i) => v * ctx.w[i]),
    };
    if (S.isAuction) {
      const cap = Math.max(ctx.maxBid, 0);
      // C14:放棄上限 = floor(min(策略上限, 合法最高出價)) —— 語意不變,只把四捨五入改成 floor (規格 §18)
      const ceiling = Math.floor(Math.min(decisionWorth * (1 + margin), cap));
      rec.ceiling = Math.max(ceiling, Math.min(S.minBid, cap));
      rec.target = Math.max(Math.min(pyRound(decisionWorth * tf), pyRound(fair), rec.ceiling), Math.min(S.minBid, cap));
      if (ov && isNum(ov.targetPrice)) {   // 使用者自訂目標價:直接作為建議出價,上限至少為此價,都不超過合法最高出價
        rec.target = Math.max(Math.min(Math.floor(ov.targetPrice), cap), Math.min(S.minBid, cap));
        rec.ceiling = Math.max(rec.ceiling, rec.target);
      }
    }
    const order = rec.contrib.map((v, i) => i).sort((a, b) => rec.contrib[b] - rec.contrib[a]);
    const top = order.slice(0, 3).filter((i) => rec.contrib[i] >= 0.5).map((i) => `${ctx.cats[i].label}${rec.contrib[i] >= 0 ? '+' : ''}${rec.contrib[i].toFixed(1)}`);
    if (top.length) rec.reasons.push('強項 ' + top.join(' '));
    const weak = ctx.need.map((v, i) => i).sort((a, b) => ctx.need[b] - ctx.need[a]).slice(0, 2).filter((i) => ctx.need[i] > 0.25 && z[i] > 0.3).map((i) => ctx.cats[i].label);
    if (weak.length) rec.reasons.push('補強 ' + weak.join('、'));
    if (ctx.unfilled > 0 && gain) rec.reasons.push('可補先發位置');
    const own = Math.max(adj - ctx.replP, 0);
    if (own - mrv > 0.5) rec.reasons.push(`與陣容位置重疊,邊際價值 ${mrv.toFixed(1)} (自身 ${own.toFixed(1)})`);
    if (row.availMult < 0.97) rec.reasons.push(`出勤調整 ×${row.availMult.toFixed(2)}`);
    if (row.gpFactor < 0.8) rec.reasons.push(`出賽偏少(${Math.trunc(row.gp)}場)`);
    if (rec.status && rec.status !== 'NA') rec.reasons.push(`傷病:${rec.status}`);
    if (rec.doNotDraft) rec.reasons.push('你已標記為不選 (手動)');
    if (valueAdj) rec.reasons.push(`手動價值調整 ${valueAdj > 0 ? '+' : ''}${valueAdj} (決策值 ${Math.round(decisionWorth)})`);
    if (ov && isNum(ov.targetPrice) && S.isAuction) rec.reasons.push(`手動目標價 ${Math.floor(ov.targetPrice)}`);
    if (rec.survival) rec.reasons.push(`估計撐到 #${rec.survival.targetPick}:${Math.round(rec.survival.estimate * 100)}% (模型估計,依${rec.survival.basis})`);
    if (!S.isAuction && rec.adp !== null && ctx.nextPick) {
      const [p1, p2] = ctx.nextPick;
      if (rec.adp >= p2 + 3) { rec.tag = '可等下輪'; rec.reasons.push(`ADP ${Math.round(rec.adp)} 晚於我再下次順位 #${p2},可先選別人`); }
      else if (rec.adp + 12 < p1) { rec.tag = '價值撿漏'; rec.reasons.push(`ADP ${Math.round(rec.adp)} 遠早於目前順位 #${p1}`); }
    }
    return rec;
  }

  function recommend(state, cfg, n) {
    n = n || cfg.nRecs || 5;
    const ctx = buildContext(state, cfg), S = state.settings;
    if (ctx.spots <= 0) return { recs: [], ctx };
    // C6:不再先用原始分數截取前 80 名;先對全部可選球員計算指標,再排除不可能的選項,最後排序。
    let cands = state.available().map((p) => evaluate(state, cfg, ctx, p.pid)).filter((c) => c && !c.doNotDraft);
    if (S.isAuction) cands = cands.filter((c) => c.fair <= ctx.maxBid + 0.5);
    cands.sort((a, b) => b.decisionScore - a.decisionScore);
    if (!cands.length) return { recs: [], ctx };
    if (!S.isAuction) return { recs: cands.slice(0, n), ctx };

    const k = Math.ceil(n / 2), chosen = cands.slice(0, k);
    chosen.forEach((c) => { c.tag = '核心目標'; });
    const rest = cands.slice(k);
    const bargains = rest.filter((c) => c.fair >= 3 && c.decisionWorth > c.fair).sort((a, b) => b.decisionWorth / b.fair - a.decisionWorth / a.fair);
    for (const c of bargains) if (chosen.length < n) { c.tag = '高CP值'; chosen.push(c); }
    for (const c of rest) { if (chosen.length >= n) break; if (!chosen.includes(c)) chosen.push(c); }
    return { recs: chosen, ctx };
  }

  // ================================================================== 決策層 (Phase 2)
  // 所有輸出都標示資料性質:observed (實際紀錄) / calculated (確定公式) / heuristic (啟發式估計)。
  // 威脅與提名都是 heuristic:權重與門檻寫成具名常數,每個結果都附上各因素的原始數值,方便使用者自行判斷。

  /** 預期成交價 (= rec.fair,規格的 Market $):最低價不通膨,只有溢價部分乘上通膨。 */
  function expectedPrice(settings, dollars, infl) {
    return settings.minBid + (dollars - settings.minBid) * (isNum(infl) ? infl : 1);
  }

  const THREAT_WEIGHTS = { position: 0.5, category: 0.3, urgency: 0.2 };   // heuristic
  const THREAT_LEVELS = { high: 0.6, medium: 0.35 };                        // heuristic
  const BENCH_ONLY_POSITION_FACTOR = 0.3;                                    // heuristic:只能進板凳時的位置因子
  const NOMINATION = { tierShare: 0.30, burnWorthRatio: 0.8, burnMinCompetitors: 2, avoidMinGap: 3, avoidGapRatio: 0.2, targetMinOverMin: 2 };

  function threatLevel(score) {
    if (!(score > 0)) return 'NONE';
    return score >= THREAT_LEVELS.high ? 'HIGH' : (score >= THREAT_LEVELS.medium ? 'MEDIUM' : 'LOW');
  }

  /**
   * 對手模型:每隊的預算、名額、最高出價、已選球員、位置缺口、類別需求、可能目標,以及聯盟各位置的供需。
   * 對手的類別需求用與我方相同的 categoryNeed();對手的 Punt 與類別偏好無從得知,一律假設為等權 (假設)。
   */
  function buildOpponentModel(state, cfg) {
    const S = state.settings, m = state.model, cats = m.cats, active = activeSlots(S);
    const infl = state.inflation();
    const avail = state.available();
    const teams = state.teams.map((t) => {
      const pids = state.roster(t.key).map((p) => p.pid);
      const posSets = pids.map((pid) => state.get(pid).posSet);
      const { count, matchSlot } = matchDetail(active, posSets);
      const openStarterSlots = active.filter((_slot, i) => matchSlot[i] === -1);
      const need = categoryNeed(state, pids);
      let w = need.map((nd) => Math.max(1 + (cfg.needBeta || 0) * nd, 0));
      const sw = sum(w); if (sw > 0) w = w.map((x) => (x * cats.length) / sw);
      const positionNeeds = {};
      openStarterSlots.forEach((slot) => { positionNeeds[slot] = (positionNeeds[slot] || 0) + 1; });
      const ctx = {
        key: t.key, name: t.name, isMe: t.key === state.myKey, pids, posSets, matched: count,
        starterOpen: openStarterSlots.length, openSpots: state.openSpots(t.key),
        budgetLeft: S.isAuction ? state.budgetLeft(t.key) : null, maxBid: S.isAuction ? state.maxBid(t.key) : null,
        need, w, positionNeeds,
        categoryNeeds: cats.map((c, i) => ({ label: c.label, need: need[i] })).filter((x) => x.need > 0.25).sort((a, b) => b.need - a.need),
      };
      // 可能目標:對方的需求權重下分數最高、能補對方先發缺口 (若有缺口)、且買得起預期價的可選球員
      ctx.likelyTargets = ctx.openSpots <= 0 ? [] : avail
        .filter((p) => (ctx.starterOpen > 0 ? maxMatch(active, posSets.concat([p.posSet])) > count : true))
        .filter((p) => !S.isAuction || expectedPrice(S, p.dollars, infl) <= ctx.maxBid)
        .map((p) => ({ pid: p.pid, name: p.name, score: m.riskAdjust(dot(p.zv, w), p.availMult) }))
        .sort((a, b) => b.score - a.score).slice(0, 3);
      return ctx;
    });
    // 聯盟層級的位置供需 (不含 UTIL/BN):供給 = 可選且高於替補線的球員數;需求 = 各隊尚未填的該位置先發名額
    const positions = Object.keys(m.slotCaps || {}).map((pos) => ({
      pos,
      openSlots: sum(teams.map((t) => t.positionNeeds[pos] || 0)),
      teamsNeeding: teams.filter((t) => (t.positionNeeds[pos] || 0) > 0).length,
      supplyAboveRepl: avail.filter((p) => p.posSet.has(pos) && p.value >= m.replZ).length,
    }));
    return { teams, positions, infl, source: 'observed + heuristic' };
  }

  /** 單一對手對某球員的威脅 (heuristic)。threat = 預算能力 × (0.5 位置 + 0.3 類別 + 0.2 先發急迫度)。 */
  function threatFor(state, teamCtx, p, price) {
    const S = state.settings, active = activeSlots(S);
    if (!teamCtx || teamCtx.openSpots <= 0 || !p || !p.valid) {
      return { score: 0, level: 'NONE', canAfford: false, fillsStarter: false, factors: { budget: 0, position: 0, category: 0, urgency: 0 } };
    }
    const budget = S.isAuction ? (teamCtx.maxBid >= price ? 1 : clip(teamCtx.maxBid / Math.max(price, 1e-9), 0, 1)) : 1;
    const fillsStarter = maxMatch(active, teamCtx.posSets.concat([p.posSet])) > teamCtx.matched;
    const position = fillsStarter ? 1 : (teamCtx.openSpots > teamCtx.starterOpen ? BENCH_ONLY_POSITION_FACTOR : 0);
    const num = sum(p.zv.map((z, i) => teamCtx.need[i] * z)), den = sum(p.zv.map((z) => Math.abs(z)));
    const category = clip(0.5 + 0.5 * (den > 0 ? num / den : 0), 0, 1);   // 沒有需求資訊時為中性 0.5
    const urgency = active.length ? teamCtx.starterOpen / active.length : 0;
    const score = budget * (THREAT_WEIGHTS.position * position + THREAT_WEIGHTS.category * category + THREAT_WEIGHTS.urgency * urgency);
    return { score, level: threatLevel(score), canAfford: budget >= 1, fillsStarter, factors: { budget, position, category, urgency } };
  }

  /** 目前這名球員:誰可能跟我搶?回傳依威脅排序的對手清單與摘要。 */
  function analyzeThreat(state, cfg, pid, opp) {
    const p = state.get(pid);
    if (!p || !p.valid) return null;
    opp = opp || buildOpponentModel(state, cfg);
    const price = expectedPrice(state.settings, p.dollars, opp.infl);
    const rows = opp.teams.filter((t) => !t.isMe).map((t) => Object.assign({
      teamKey: t.key, teamName: t.name, budgetLeft: t.budgetLeft, maxBid: t.maxBid, openSpots: t.openSpots, starterOpen: t.starterOpen,
      needCats: t.categoryNeeds.map((x) => x.label),
    }, threatFor(state, t, p, price))).sort((a, b) => b.score - a.score);
    const summary = {
      high: rows.filter((r) => r.level === 'HIGH').length,
      medium: rows.filter((r) => r.level === 'MEDIUM').length,
      capable: rows.filter((r) => r.canAfford && (r.level === 'HIGH' || r.level === 'MEDIUM')).length,
    };
    return { pid, expectedPrice: price, rows, summary, source: 'heuristic' };
  }

  /** 拍賣提名助手 (heuristic):自己要的 (target)、消耗對手預算 (burn)、不適合自己出手 (avoid)。 */
  function nominationAdvice(state, cfg, n, opp) {
    const S = state.settings;
    n = n || 5;
    const empty = { available: false, target: [], burn: [], avoid: [], source: 'heuristic' };
    if (!S.isAuction) return Object.assign(empty, { reason: '提名建議只適用拍賣選秀。' });
    const ctx = buildContext(state, cfg);
    if (ctx.spots <= 0) return Object.assign(empty, { reason: '你的陣容已滿。' });
    opp = opp || buildOpponentModel(state, cfg);
    const rows = state.available().map((p) => {
      const rec = evaluate(state, cfg, ctx, p.pid);
      const price = expectedPrice(S, p.dollars, opp.infl);
      const worth = rec ? rec.decisionWorth : S.minBid;
      const th = analyzeThreat(state, cfg, p.pid, opp);
      return { p, rec, price, worth, gap: worth - price, mrv: rec ? rec.mrv : 0, comp: th.summary };
    });
    const prices = rows.map((r) => r.price).filter((x) => x > S.minBid).sort((a, b) => b - a);
    const tierCut = prices.length ? prices[Math.min(Math.floor(prices.length * NOMINATION.tierShare), prices.length - 1)] : Infinity;
    const item = (r, kind, reasons) => ({
      kind, pid: r.p.pid, name: r.p.name, pos: (r.p.pos || []).join('/'), expectedPrice: r.price, worth: r.worth, valueGap: r.gap,
      mrv: r.mrv, competitors: r.comp, reasons, source: 'heuristic',
    });
    const compText = (c) => `能出到預期價且有需求的對手 ${c.capable} 隊 (高威脅 ${c.high})`;
    const target = rows
      .filter((r) => r.rec && !r.rec.doNotDraft && r.price <= ctx.maxBid && r.price >= S.minBid + NOMINATION.targetMinOverMin && r.gap >= 0)
      .sort((a, b) => (b.gap - a.gap) || (a.comp.capable - b.comp.capable)).slice(0, n)
      .map((r) => item(r, 'target', [`對我價值 ${Math.round(r.worth)} ≥ 預期成交 ${Math.round(r.price)} (差 +${Math.round(r.gap)})`, `陣容邊際價值 ${r.mrv.toFixed(1)}`, compText(r.comp)]));
    const burn = rows
      .filter((r) => r.price >= tierCut && r.worth <= NOMINATION.burnWorthRatio * r.price && r.comp.capable >= NOMINATION.burnMinCompetitors)
      .sort((a, b) => b.price * b.comp.capable - a.price * a.comp.capable).slice(0, n)
      .map((r) => item(r, 'burn', [`預期成交 ${Math.round(r.price)},屬於剩餘球員中高價的前 ${Math.round(NOMINATION.tierShare * 100)}%`, compText(r.comp), `對我價值只有 ${Math.round(r.worth)};若無人加價,你會以提名價得標`]));
    const burnIds = new Set(burn.map((x) => x.pid));
    const avoid = rows
      .filter((r) => !burnIds.has(r.p.pid) && r.price >= tierCut && (r.price - r.worth) >= Math.max(NOMINATION.avoidMinGap, NOMINATION.avoidGapRatio * r.price))
      .sort((a, b) => (b.price - b.worth) - (a.price - a.worth)).slice(0, n)
      .map((r) => item(r, 'avoid', [`預期成交 ${Math.round(r.price)},對我價值 ${Math.round(r.worth)} (差 ${Math.round(r.worth - r.price)})`, r.rec && r.mrv < Math.max((r.rec.var || 0), 0) - 0.5 ? '與陣容位置重疊,邊際價值低' : '對目前陣容/預算的邊際價值低', compText(r.comp)]));
    return { available: true, target, burn, avoid, tierCut, source: 'heuristic' };
  }

  /**
   * 四軌推薦:A 最佳球員 (全域價值) / B 最佳 CP (對我價值 − 預期成交;Snake 用 ADP 與模型排名差) /
   * C 最佳陣容補強 (陣容邊際價值) / D 提名目標 (僅拍賣)。每一軌都先對全部可選球員計算指標,再排除不可能選項,最後排序。
   */
  function recommendTracks(state, cfg, n) {
    n = n || cfg.nRecs || 5;
    const S = state.settings, ctx = buildContext(state, cfg);
    const out = { bestPlayer: [], bestValue: [], bestFit: [], nomination: [], notes: {}, ctx };
    if (ctx.spots <= 0) { out.notes.all = '你的陣容已滿。'; return out; }
    let recs = state.available().map((p) => evaluate(state, cfg, ctx, p.pid)).filter((r) => r && !r.doNotDraft);
    if (S.isAuction) recs = recs.filter((r) => r.fair <= ctx.maxBid + 0.5);
    const withMetric = (r, label, value) => Object.assign({}, r, { metric: { label, value } });
    out.bestPlayer = recs.slice().sort((a, b) => state.get(b.pid).value - state.get(a.pid).value).slice(0, n)
      .map((r) => withMetric(r, '全域價值', state.get(r.pid).value));
    if (S.isAuction) {
      out.bestValue = recs.filter((r) => r.fair >= S.minBid + 1).sort((a, b) => (b.decisionWorth - b.fair) - (a.decisionWorth - a.fair)).slice(0, n)
        .map((r) => withMetric(r, '對我價值 − 預期成交', r.decisionWorth - r.fair));
    } else {
      const withAdp = recs.filter((r) => r.adp != null);
      if (!withAdp.length) out.notes.bestValue = '目前資料沒有 ADP,Snake 模式無法計算 CP 值 (模型排名 vs 市場順位)。';
      out.bestValue = withAdp.map((r) => ({ r, gap: r.adp - state.get(r.pid).rank })).sort((a, b) => b.gap - a.gap).slice(0, n)
        .map((x) => withMetric(x.r, 'ADP − 模型排名', x.gap));
    }
    out.bestFit = recs.slice().sort((a, b) => b.mrv - a.mrv).slice(0, n).map((r) => withMetric(r, '陣容邊際價值', r.mrv));
    if (S.isAuction) out.nomination = nominationAdvice(state, cfg, n).target;
    else out.notes.nomination = '提名建議只適用拍賣選秀。';
    return out;
  }

  // ------------------------------------------------------------------ 跨季比較 / 新秀
  /** 把「比較季」的資料 (依姓名比對) 附加到模型每位球員的 p.cmp / p.cmpLabel。 */
  function attachComparison(model, label, byName) {
    if (!byName) return;
    model.players.forEach((p) => {
      const row = byName.get(normName(p.name));
      if (row) { p.cmp = row; p.cmpLabel = label; }
    });
  }

  /** 把新秀名單 (無歷史數據) 以 pid = "rookie:<正規化姓名>" 加進模型,valid=false (不進入估值/主推薦),
   *  但可被搜尋、記錄選秀、開啟球員詳情 —— 沿用既有「無資料球員」的手動記錄流程。已存在的 pid 不重複加入。 */
  function attachRookiePool(model, rookies) {
    const seen = new Set(model.players.map((p) => p.pid));
    for (const r of rookies || []) {
      const pid = 'rookie:' + normName(r.name);
      if (seen.has(pid)) continue;
      const row = { pid, name: r.name, team: r.team || '', pos: r.pos || [], status: '', valid: false,
                    zv: null, value: null, dollars: null, gp: null, gpFactor: 1, rank: null, adp: null,
                    posSet: expandPositions(r.pos || []), isRookie: true, rookieMeta: r,
                    sid: nameKeyOf(r.name), nameKey: nameKeyOf(r.name), sidBasis: 'name' };
      model.players.push(row); model.byId.set(pid, row); seen.add(pid);
      if (model.bySid && !model.bySid.has(row.sid)) model.bySid.set(row.sid, row);
    }
  }

  /** 新秀推薦:獨立於主推薦,依靜態名單的分級 + 位置缺口 + 目前陣容缺補的類別排序。 */
  function recommendRookies(state, cfg, pool, n) {
    n = n || 5;
    const ctx = buildContext(state, cfg);
    const drafted = state.draftedIds();
    const catIndex = {}; ctx.cats.forEach((c, i) => { catIndex[c.label] = i; });
    const tierScore = { 1: 100, 2: 80, 3: 60, 4: 40, 5: 20 };
    const avail = (pool || []).filter((r) => !drafted.has('rookie:' + normName(r.name)));
    const scored = avail.map((r) => {
      const posSet = expandPositions(r.pos || []);
      const gain = ctx.unfilled > 0 && (maxMatch(ctx.active, ctx.myPos.concat([posSet])) - ctx.matchedNow) > 0;
      let needBonus = 0; const matchedCats = [];
      (r.keyCats || []).forEach((label) => {
        const i = catIndex[label];
        if (i == null) return;
        needBonus += Math.max(ctx.need[i], 0) * 15;
        if (ctx.need[i] > 0.25) matchedCats.push(label);
      });
      const score = (tierScore[r.tier] || 50) + (gain ? 12 : 0) + needBonus;
      return { r, score, gain, matchedCats };
    });
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, n).map((x) => ({
      pid: 'rookie:' + normName(x.r.name), name: x.r.name, team: x.r.team, pos: (x.r.pos || []).join('/'),
      tier: x.r.tier, roundLow: x.r.roundLow, roundHigh: x.r.roundHigh, blurb: x.r.blurb,
      keyCats: x.r.keyCats || [], matchedCats: x.matchedCats, canFillStarter: x.gain,
    }));
  }

  /** 新秀選秀池的完整列表 (含選走狀態),給獨立分頁使用;不做需求加權,只依選秀順位排序。 */
  function rookiePoolRows(state, pool) {
    return (pool || []).map((r) => {
      const pid = 'rookie:' + normName(r.name);
      const pk = state.picks.find((p) => p.pid === pid);
      return Object.assign({}, r, { pid, draftedBy: pk ? state.teamName(pk.teamKey) : null, isMine: !!pk && pk.teamKey === state.myKey });
    });
  }

  // ------------------------------------------------------------------ 現場模式 (Phase 4,Draft Day Mode)
  /** 蛇形選秀順序:其他隊依 draftPosition;若設定了 myDraftSlot,把我方放到該順位 (與 nextMyPicks 一致)。 */
  function draftOrder(state, cfg) {
    const order = state.teams.slice().sort((a, b) => (a.draftPosition || 99) - (b.draftPosition || 99));
    const mySlot = cfg && cfg.myDraftSlot;
    if (mySlot) {
      const i = order.findIndex((t) => t.key === state.myKey);
      if (i >= 0) { const [me] = order.splice(i, 1); order.splice(clip(mySlot, 1, order.length + 1) - 1, 0, me); }
    }
    return order;
  }
  function teamOnClock(state, cfg) {
    if (state.settings.isAuction) return null;
    const order = draftOrder(state, cfg), n = order.length, k = state.picksMade();
    const r = Math.floor(k / n), i = k % n;
    return order[r % 2 === 0 ? i : n - 1 - i] || null;
  }

  const LIVE = { snakeMidTopN: 3, nextTargets: 5 };
  /**
   * 目前這名球員的現場決策:BUY / WAIT / PASS。
   * 拍賣:直接沿用 bidVerdict (低於建議價 BUY、溢價區 WAIT、達上限 PASS),不另立規則。
   * Snake (heuristic):撐到下一次的估計 < 40% → BUY、> 70% → WAIT;中間時陣容邊際價值前 3 名 → BUY,否則 WAIT。
   * 下一批目標:高優先 (手動標記) 在前,其餘依陣容邊際價值,排除目前球員與「不選」。
   */
  function liveDecision(state, cfg) {
    const a = state.currentAuction;
    if (!a) return null;
    const p = state.get(a.pid);
    if (!p) return null;
    const S = state.settings, ctx = buildContext(state, cfg);
    const rec = p.valid ? evaluate(state, cfg, ctx, a.pid) : null;
    const evals = state.available().map((x) => (x.pid === a.pid ? rec : evaluate(state, cfg, ctx, x.pid)))
      .filter((r) => r && !r.doNotDraft && (!S.isAuction || r.fair <= ctx.maxBid + 0.5));
    const reasons = [];
    let decision = null;
    if (!p.valid) reasons.push('沒有估值資料 (例如新秀),請自行判斷。');
    else if (!rec) { decision = 'PASS'; reasons.push(ctx.spots <= 0 ? '你的陣容已滿。' : '加入後無法湊齊先發位置。'); }
    else if (rec.doNotDraft) { decision = 'PASS'; reasons.push('你已標記為不選 (手動)。'); }
    else if (S.isAuction) {
      const bid = a.currentBid == null ? 0 : a.currentBid;
      if (a.highBidder === state.myKey) { decision = 'BUY'; reasons.push(`你目前是最高出價者 (${a.currentBid}),不需要動作。`); }
      else if (bid >= ctx.maxBid) { decision = 'PASS'; reasons.push(`目前叫價 ${bid} 已達你的合法最高出價 ${ctx.maxBid}。`); }
      else {
        const v = bidVerdict(rec, bid);
        decision = { cheap: 'BUY', premium: 'WAIT', stop: 'PASS' }[v];
        reasons.push({ cheap: `叫價 ${bid} 低於建議出價 ${rec.target},可以繼續加。`, premium: `叫價 ${bid} 已在溢價區 (建議 ${rec.target}、上限 ${rec.ceiling}),非必要不加價。`, stop: `叫價 ${bid} 已達放棄上限 ${rec.ceiling}。` }[v]);
      }
    } else {
      const mrvRank = evals.filter((r) => r.mrv > rec.mrv).length + 1;
      const sv = rec.survival;
      const svText = sv ? `估計撐到 #${sv.targetPick}:${Math.round(sv.estimate * 100)}% (模型估計,依${sv.basis})` : '沒有生存估計 (不知道你的順位)';
      if (sv && sv.estimate < SURVIVAL.riskyBelow) decision = 'BUY';
      else if (sv && sv.estimate > SURVIVAL.safeAbove) decision = 'WAIT';
      else decision = mrvRank <= LIVE.snakeMidTopN ? 'BUY' : 'WAIT';
      reasons.push(svText, `陣容邊際價值在可選球員中排第 ${mrvRank}`);
    }
    const th = p.valid ? analyzeThreat(state, cfg, a.pid) : null;
    return {
      pid: a.pid, name: p.name, pos: (p.pos || []).join('/'), auction: Object.assign({}, a, { bids: a.bids.slice() }),
      decision, reasons, source: S.isAuction ? 'calculated' : 'heuristic', modelVersion: VALUATION_MODEL_VERSION, decisionVersion: DECISION_MODEL_VERSION,
      mine: rec ? { personalValue: rec.decisionWorth, modelWorth: rec.worth, expectedPrice: rec.fair, recommendedBid: rec.target, maxBid: rec.ceiling,
        legalMax: ctx.maxBid, mrv: rec.mrv, survival: rec.survival } : null,
      threats: th ? th.rows.filter((r) => r.level !== 'NONE').slice(0, 3) : [],
      nextTargets: rankNextTargets(evals.filter((r) => r.pid !== a.pid)),
    };
  }

  function rankNextTargets(evals) {
    const high = evals.filter((r) => r.priority === 'high').sort((x, y) => y.mrv - x.mrv);
    const rest = evals.filter((r) => r.priority !== 'high').sort((x, y) => y.mrv - x.mrv);
    return high.concat(rest).slice(0, LIVE.nextTargets);
  }
  /** 下一批目標 (現場模式在沒有目前球員時也會用到):高優先在前,其餘依陣容邊際價值;排除「不選」與買不起的球員。 */
  function nextTargets(state, cfg, excludePid) {
    const S = state.settings, ctx = buildContext(state, cfg);
    return rankNextTargets(state.available().filter((x) => x.pid !== excludePid).map((x) => evaluate(state, cfg, ctx, x.pid))
      .filter((r) => r && !r.doNotDraft && (!S.isAuction || r.fair <= ctx.maxBid + 0.5)));
  }

  // ================================================================== Draft Simulation (Phase 5,heuristic)
  // 我方「照模型行動」:拍賣出價上限 = 模型的放棄上限 (rec.ceiling);Snake 選 recommend() 第一名。
  // 對手 (heuristic):拍賣出價上限 = 預期成交價 × (1 + 常態誤差 oppBidNoise);Snake 依 ADP + 常態誤差選人,
  //   σ 與 Snake 生存估計相同 (max(3, 0.2 × 預期順位)),沒有 ADP 時用模型排名。
  // 拍賣:輪流提名「基礎價 × (1 + 誤差)」最高者;成交價 = 第二高出價 + 1 (不超過得標者的上限,不低於最低價);
  //   沒有人要時由提名者以最低價得標 (提名者放不下則視為流標)。所有隊伍都受合法最高出價與陣容位置限制。
  const SIMULATION = { oppBidNoise: 0.15, nominationNoise: 0.10, nominationPool: 30, snakeCandidatePool: 40, runChoices: [100, 500, 1000] };

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gaussian(rng) {
    let u = 0;
    while (u === 0) u = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng());
  }

  /** 這隊能不能放進這名球員:有空位;若剩下的空位都得用來補先發,就必須能補上先發缺口 (與 evaluate 的規則相同)。 */
  function canRoster(state, teamKey, p) {
    if (!p || state.openSpots(teamKey) <= 0) return false;
    const active = activeSlots(state.settings);
    const posSets = state.roster(teamKey).map((pk) => state.get(pk.pid).posSet);
    const matched = maxMatch(active, posSets);
    if (state.openSpots(teamKey) > active.length - matched) return true;
    return maxMatch(active, posSets.concat([p.posSet])) > matched;
  }

  /** 依預期被選順位排序的球員 (ADP,沒有則用模型排名);每場模擬共用。 */
  function simulationOrder(state) {
    const edp = (p) => (isNum(p.adp) ? p.adp : p.rank);
    return state.model.players.filter((p) => p.valid).slice().sort((a, b) => edp(a) - edp(b));
  }

  function cloneForSim(state) {
    const st = new DraftState(state.settings, state.model, state.teams, state.myKey);
    st.overrides = state.overrides || {}; st.cfg = state.cfg; st.snapshotsEnabled = false;
    st.picks = state.picks.map((pk) => Object.assign({}, pk));
    return st;
  }

  function simAuctionStep(st, cfg, rng, sim) {
    const S = st.settings;
    const nominators = st.teams.filter((t) => st.openSpots(t.key) > 0 && !(sim.excludeMe && t.key === st.myKey));
    if (!nominators.length) return null;
    const nom = nominators[sim.nomIdx++ % nominators.length];
    const pool = st.available().filter((p) => !sim.unsold.has(p.pid)).slice(0, SIMULATION.nominationPool);
    if (!pool.length) return null;
    let p = null, bestN = -Infinity;
    pool.forEach((c) => { const v = c.dollars * (1 + sim.nominationNoise * gaussian(rng)); if (v > bestN) { bestN = v; p = c; } });
    const price0 = expectedPrice(S, p.dollars, st.inflation());
    let myCeiling = null;
    const bids = st.teams.map((t) => {
      if (!canRoster(st, t.key, p)) return 0;
      let w;
      if (t.key === st.myKey) {
        if (sim.excludeMe) return 0;
        const r = evaluate(st, cfg, buildContext(st, cfg), p.pid);
        w = r && !r.doNotDraft ? r.ceiling : 0; myCeiling = w;
      } else w = price0 * (1 + sim.oppBidNoise * gaussian(rng));
      return Math.max(0, Math.min(Math.floor(w), st.maxBid(t.key)));
    });
    const order = bids.map((b, i) => ({ b, i })).sort((x, y) => y.b - x.b);
    const top = order[0].b;
    let winner, price, defaulted = false;
    if (top >= S.minBid) {
      const tied = order.filter((x) => x.b === top);
      winner = tied[Math.floor(rng() * tied.length)].i;
      const second = tied.length > 1 ? top : (order[1] ? order[1].b : 0);
      price = Math.max(S.minBid, Math.min(top, second + 1));
    } else if (canRoster(st, nom.key, p) && st.maxBid(nom.key) >= S.minBid) {
      winner = st.teams.indexOf(nom); price = S.minBid; defaulted = true;
    } else { sim.unsold.add(p.pid); return { unsold: p.pid }; }
    const teamKey = st.teams[winner].key, legalMax = st.maxBid(teamKey);
    st.addPick(p.pid, teamKey, price, 'sim');
    return { pid: p.pid, teamKey, price, legalMax, myCeiling, defaulted, nominatedBy: nom.key };
  }

  function teamAtPick(state, cfg, k) {
    const order = draftOrder(state, cfg), n = order.length, r = Math.floor(k / n), i = k % n;
    return order[r % 2 === 0 ? i : n - 1 - i];
  }
  function simSnakeStep(st, cfg, rng, sim) {
    const n = st.teams.length;
    let team = null;
    for (let k = st.picksMade(); k < st.picksMade() + 2 * n; k++) { const t = teamAtPick(st, cfg, k); if (t && st.openSpots(t.key) > 0) { team = t; break; } }
    if (!team) return null;
    if (team.key === st.myKey && sim.excludeMe) return { myTurn: true };
    let p = null, expectedMyPick = null;
    if (team.key === st.myKey) {
      const r = snakeBestPick(st, cfg);
      if (sim.checkMyPick) { const full = recommend(st, cfg, 1).recs[0]; expectedMyPick = full ? full.pid : null; }
      if (!r) return null;
      p = st.get(r.pid);
    } else {
      const drafted = st.draftedIds();
      const pool = [];
      for (const c of sim.byEdp) { if (!drafted.has(c.pid)) { pool.push(c); if (pool.length >= SIMULATION.snakeCandidatePool) break; } }
      let best = Infinity;
      pool.forEach((c) => {
        if (!canRoster(st, team.key, c)) return;
        const edp = isNum(c.adp) ? c.adp : c.rank;
        const v = edp + Math.max(SURVIVAL.sigmaMin, SURVIVAL.sigmaRatio * edp) * gaussian(rng);
        if (v < best) { best = v; p = c; }
      });
      if (!p) p = st.available().find((c) => canRoster(st, team.key, c)) || null;   // 前段候選都放不下時,依序找第一個放得下的
      if (!p) return null;
    }
    st.addPick(p.pid, team.key, 0, 'sim');
    return { pid: p.pid, teamKey: team.key, price: 0, expectedMyPick };
  }

  function simParams(opts) {
    const p = { oppBidNoise: SIMULATION.oppBidNoise, nominationNoise: SIMULATION.nominationNoise };
    ['oppBidNoise', 'nominationNoise'].forEach((k) => {
      if (opts && opts[k] != null) {
        const v = Number(opts[k]);
        if (!isNum(v) || v < 0 || v > 1) throw new Error(`${k} 必須介於 0 與 1 之間`);
        p[k] = v;
      }
    });
    return p;
  }

  /** 從目前狀態模擬到選秀結束 (一場)。回傳模擬後的狀態複本;不改動傳入的狀態。 */
  function simulateOnce(base, cfg, rng, opts) {
    opts = opts || {};
    const st = cloneForSim(base);
    const sim = Object.assign({ nomIdx: opts.nomStart || 0, unsold: new Set(), excludeMe: !!opts.excludeMe, byEdp: opts.byEdp || simulationOrder(base), checkMyPick: !!opts.checkMyPick }, simParams(opts));
    const step = st.settings.isAuction ? simAuctionStep : simSnakeStep;
    const maxSteps = st.teams.length * rosterSize(st.settings) * 3;
    for (let i = 0; i < maxSteps; i++) {
      if (st.teams.every((t) => st.openSpots(t.key) <= 0)) break;
      const r = step(st, cfg, rng, sim);
      if (!r || r.myTurn) break;
      if (r.pid && opts.onPick) opts.onPick(r);
    }
    return st;
  }

  function pctl(sorted, q) {
    if (!sorted.length) return null;
    const i = (sorted.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
  }
  function dist(arr) {
    const s = arr.slice().sort((a, b) => a - b);
    return { mean: s.length ? sum(s) / s.length : null, p10: pctl(s, 0.1), p50: pctl(s, 0.5), p90: pctl(s, 0.9) };
  }

  /**
   * 可分段執行的 Monte Carlo 模擬 (背景執行與進度顯示用):step(k) 再跑 k 場;done 後用 result() 取得彙總。
   * 每場從「目前的選秀狀態」開始模擬到結束;模擬開始前已選走的球員不列入取得頻率。
   */
  function createSimulation(state, cfg, opts) {
    opts = opts || {};
    const runs = clip(Math.round(opts.runs || 100), 1, 5000);
    const params = simParams(opts);
    const seed = isNum(opts.seed) ? (opts.seed >>> 0) : (Date.now() % 2147483647);
    const rng = mulberry32(seed), byEdp = simulationOrder(state);
    const S = state.settings, cats = state.model.cats, n = state.teams.length, startPicks = state.picks.length;
    const acc = { spent: [], value: [], valueRank: [], fill: [], pos: POSITIONS.map(() => []), catZ: cats.map(() => []), catRank: cats.map(() => []), players: new Map() };
    const t0 = Date.now();
    let completed = 0;
    function runOne() {
      const fin = simulateOnce(state, cfg, rng, Object.assign({ byEdp, nomStart: Math.floor(rng() * n) }, params));
      const teamStats = fin.teams.map((t) => {
        const ps = fin.roster(t.key).map((pk) => fin.get(pk.pid)).filter((p) => p && p.valid);
        return { key: t.key, z: cats.map((_c, i) => sum(ps.map((p) => p.zv[i]))), value: sum(ps.map((p) => p.value)) };
      });
      const me = teamStats.find((t) => t.key === state.myKey);
      const myRoster = fin.roster(state.myKey).map((pk) => fin.get(pk.pid));
      acc.fill.push(myRoster.length);
      acc.spent.push(fin.spent(state.myKey));
      acc.value.push(me.value);
      acc.valueRank.push(1 + teamStats.filter((t) => t.value > me.value).length);
      POSITIONS.forEach((pos, i) => acc.pos[i].push(myRoster.filter((p) => p && p.posSet && p.posSet.has(pos)).length));
      cats.forEach((_c, i) => { acc.catZ[i].push(me.z[i]); acc.catRank[i].push(1 + teamStats.filter((t) => t.z[i] > me.z[i]).length); });
      fin.picks.slice(startPicks).forEach((pk) => {
        if (!acc.players.has(pk.pid)) acc.players.set(pk.pid, { mine: 0, drafted: 0, priceSum: 0, priceMineSum: 0, pickSum: 0 });
        const a = acc.players.get(pk.pid);
        a.drafted++; a.priceSum += pk.price; a.pickSum += pk.pickNo;
        if (pk.teamKey === state.myKey) { a.mine++; a.priceMineSum += pk.price; }
      });
      completed++;
    }
    return {
      total: runs, seed,
      get completed() { return completed; },
      get done() { return completed >= runs; },
      step(k) { for (let i = 0; i < (k || 1) && completed < runs; i++) runOne(); return completed; },
      result() {
        const players = [...acc.players.entries()].map(([pid, a]) => {
          const p = state.get(pid);
          return { pid, sid: p.sid, name: p.name, pos: (p.pos || []).join('/'), pMine: a.mine / completed, pDrafted: a.drafted / completed,
            avgPrice: S.isAuction ? a.priceSum / a.drafted : null, avgPriceMine: S.isAuction && a.mine ? a.priceMineSum / a.mine : null,
            avgPick: S.isAuction ? null : a.pickSum / a.drafted };
        }).sort((x, y) => (y.pMine - x.pMine) || (y.pDrafted - x.pDrafted));
        const spent = dist(acc.spent);
        return {
          source: 'simulation (heuristic)', runs: completed, seed, startedAtPick: startPicks, elapsedMs: Date.now() - t0,
          modelVersion: VALUATION_MODEL_VERSION, decisionVersion: DECISION_MODEL_VERSION,
          configFingerprint: state.model.configFingerprint || null, personalFingerprint: personalFingerprint(cfg),
          assumptions: Object.assign({}, SIMULATION, params, {
            myPolicy: S.isAuction ? '我方出價上限 = 模型的放棄上限 (rec.ceiling)' : '我方選 recommend() 第一名',
            opponentPolicy: S.isAuction ? `對手出價上限 = 預期成交價 × (1 + 常態誤差 σ=${params.oppBidNoise});輪流提名基礎價 × (1 + 誤差 σ=${params.nominationNoise}) 最高者;成交價 = 第二高出價 + 1`
              : `對手依 ADP (沒有則用模型排名) + 常態誤差選人,σ = max(${SURVIVAL.sigmaMin}, ${SURVIVAL.sigmaRatio} × 順位)`,
          }),
          my: {
            rosterFill: dist(acc.fill),
            spent: S.isAuction ? spent : null,
            leftover: S.isAuction ? { mean: S.budget - spent.mean, p10: S.budget - spent.p90, p50: S.budget - spent.p50, p90: S.budget - spent.p10 } : null,
            totalValue: dist(acc.value),
            valueRank: Object.assign(dist(acc.valueRank), { rankDist: Array.from({ length: n }, (_x, r) => acc.valueRank.filter((v) => v === r + 1).length) }),
            positions: POSITIONS.map((pos, i) => ({ pos, mean: dist(acc.pos[i]).mean })),
            categories: cats.map((c, i) => Object.assign({ label: c.label }, (({ mean, p10, p90 }) => ({ meanZ: mean, p10Z: p10, p90Z: p90 }))(dist(acc.catZ[i])),
              { meanRank: dist(acc.catRank[i]).mean, rankDist: Array.from({ length: n }, (_x, r) => acc.catRank[i].filter((v) => v === r + 1).length) })),
          },
          players,
        };
      },
    };
  }
  /**
   * S4:在「真實狀態」上模擬他隊選 n 手 (Demo 用)。與 Monte Carlo 使用同一套對手行為;我方不參與,
   * 拍賣時我方不提名也不出價;Snake 依選秀順序,輪到我方就停下。寫入真實狀態,因此照常記錄成交快照。
   */
  function simulatePicks(state, cfg, n, opts) {
    opts = opts || {};
    const rng = mulberry32(isNum(opts.seed) ? opts.seed : (Date.now() % 2147483647));
    const sim = Object.assign({ nomIdx: Math.floor(rng() * state.teams.length), unsold: new Set(), excludeMe: true, byEdp: simulationOrder(state) }, simParams(opts));
    const step = state.settings.isAuction ? simAuctionStep : simSnakeStep;
    let made = 0, stoppedAtMyTurn = false;
    for (let guard = 0; made < n && guard < n * 5; guard++) {
      const r = step(state, cfg, rng, sim);
      if (!r) break;
      if (r.myTurn) { stoppedAtMyTurn = true; break; }
      if (r.pid) made++;
    }
    return { made, stoppedAtMyTurn };
  }
  function simulateDraft(state, cfg, opts) {
    const sim = createSimulation(state, cfg, opts);
    while (!sim.done) sim.step(10);
    return sim.result();
  }

  // ------------------------------------------------------------------ Market Calibration (Phase 4,C12:只顯示,不回饋估值)
  const CALIBRATION = { minSample: 5, priceCuts: [0.025, 0.075, 0.15] };

  /** 把目前選秀中「有快照且有成交價」的紀錄整理成校準資料 (可跨選秀累積保存)。 */
  function calibrationRecords(state, draftId) {
    return state.picks.filter((pk) => pk.snap && isNum(pk.price) && pk.price > 0)
      .map((pk) => ({ draftId, sid: pk.sid || pk.snap.sid, teamKey: pk.teamKey, price: pk.price, snap: pk.snap }));
  }

  /**
   * 實際成交 ÷ 模型預期 (observed)。每組以總額計算 (比逐筆比值平均穩健);樣本少於 minSample 時不給數字。
   * 分組:位置 (第一個列出的位置)、球員層級、預期價格區間、選秀階段、主要強項類別。
   */
  function computeCalibration(records, settings, opts) {
    const minSample = (opts && opts.minSample) || CALIBRATION.minSample;
    const version = (opts && opts.modelVersion) || VALUATION_MODEL_VERSION;   // '*' = 明確要求混合所有版本;否則依主版本比對
    if (!settings || !settings.isAuction) return { available: false, reason: 'Snake 沒有成交價,市場校準只適用拍賣。', source: 'observed', minSample, modelVersion: version };
    const usable = (records || []).filter((r) => r && r.snap && isNum(r.snap.expectedPrice) && r.snap.expectedPrice > 0 && isNum(r.price) && r.price > 0);
    const excluded = {};
    const valid = usable.filter((r) => {
      if (version === '*' || sameMajor(r.snap.modelVersion, version)) return true;
      const k = r.snap.modelVersion || 'unversioned'; excluded[k] = (excluded[k] || 0) + 1; return false;
    });
    const agg = (key, list) => {
      const n = list.length, actual = sum(list.map((r) => r.price)), expected = sum(list.map((r) => r.snap.expectedPrice));
      const insufficient = n < minSample;
      return { key, n, actual, expected, ratio: insufficient ? null : actual / expected, pct: insufficient ? null : actual / expected - 1, insufficient };
    };
    const groupBy = (field) => {
      const m = new Map();
      valid.forEach((r) => { const k = r.snap[field] || '—'; if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
      return [...m.entries()].map(([k, list]) => agg(k, list)).sort((a, b) => b.n - a.n);
    };
    return {
      available: true, minSample, source: 'observed', modelVersion: version, comparedMajor: version === '*' ? '*' : majorOf(version), excluded, overall: agg('全部', valid),
      groups: { position: groupBy('primaryPos'), tier: groupBy('tier'), priceRange: groupBy('priceRange'), stage: groupBy('stage'), category: groupBy('topCat') },
    };
  }

  // ------------------------------------------------------------------ Snake 生存估計 (Phase 3,heuristic)
  // 常態分佈近似球員被選走的順位:平均 = ADP (C11:ADP 只用於時機判斷,不進任何估值);沒有 ADP 時用模型排名代替。
  // σ 為啟發式設定 (順位越後面市場分歧越大),不是由資料擬合的參數。
  const SURVIVAL = { sigmaMin: 3, sigmaRatio: 0.20, riskyBelow: 0.40, safeAbove: 0.70 };

  /** 標準常態累積分佈 (Abramowitz & Stegun 7.1.26,誤差 < 1.5e-7)。 */
  function normalCdf(x) {
    const t = 1 / (1 + 0.3275911 * Math.abs(x) / Math.SQRT2);
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-(x * x) / 2);
    return x >= 0 ? (1 + y) / 2 : (1 - y) / 2;
  }

  /** 我方下一個「會用來判斷能不能等」的順位:現在輪到我 → 算到再下一次;否則算到下一次。 */
  function survivalReference(state, cfg) {
    if (state.settings.isAuction) return null;
    const next = nextMyPicks(state, cfg);
    if (!next) return null;
    const current = state.picksMade();
    const onClock = next[0] === current + 1;
    return { current, onClock, target: onClock ? next[1] : next[0] };
  }

  /** 估計球員能撐到參考順位的機率 (條件於他目前仍未被選)。heuristic,不是統計驗證的機率。 */
  function estimateSurvival(state, cfg, pid, ref) {
    ref = ref === undefined ? survivalReference(state, cfg) : ref;
    const p = state.get(pid);
    if (!ref || !p || !p.valid) return null;
    const basis = isNum(p.adp) ? 'ADP' : (isNum(p.rank) ? '模型排名' : null);
    if (!basis) return null;
    const edp = basis === 'ADP' ? p.adp : p.rank;
    const sigma = Math.max(SURVIVAL.sigmaMin, SURVIVAL.sigmaRatio * edp);
    const tail = (t) => 1 - normalCdf((t - edp) / sigma);                 // P(被選順位 > t)
    const denom = tail(ref.current + 0.5), numer = tail(ref.target - 0.5);  // 連續性修正
    const estimate = denom < 1e-12 ? 0 : clip(numer / denom, 0, 1);
    const suggestion = estimate < SURVIVAL.riskyBelow ? '等待風險高' : (estimate > SURVIVAL.safeAbove ? '可能等得到' : '不確定');
    return { estimate, targetPick: ref.target, picksUntil: ref.target - ref.current - 1, onClock: ref.onClock, edp, sigma, basis, suggestion, source: 'heuristic' };
  }

  // ------------------------------------------------------------------ Position / Category run 偵測 (Phase 3)
  // 計數是 observed (實際選秀紀錄);判定門檻是 heuristic。只提供客觀資訊,不下「一定要搶」的指令。
  const RUN = { windowMin: 4, windowMax: 8, minCount: 3, minIntensity: 1.5, strongZ: 1.0 };

  function detectRuns(state, cfg) {
    const S = state.settings, m = state.model;
    const W = clip(Math.round(S.numTeams / 2), RUN.windowMin, RUN.windowMax);
    const picks = state.picks.slice().sort((a, b) => (a.pickNo || 0) - (b.pickNo || 0));
    const nextPick = S.isAuction ? null : (nextMyPicks(state, cfg) || [null])[0];
    const base = { window: W, picksMade: picks.length, nextPick, runs: [], positions: [], categories: [], source: 'observed + heuristic' };
    if (picks.length < W) return Object.assign(base, { insufficient: true, reason: `至少需要 ${W} 手選秀紀錄才能偵測 run (目前 ${picks.length} 手)。` });
    const recent = picks.slice(-W).map((pk) => state.get(pk.pid)).filter(Boolean);
    const pool = m.players.filter((p) => p.valid).slice(0, m.nPool);
    const avail = state.available();
    const mk = (kind, label, count, n, share, remaining) => {
      const expected = share * n;
      const intensity = expected > 0 ? count / expected : (count > 0 ? Infinity : 0);
      return { kind, label, count, window: n, expected, intensity, remaining, isRun: count >= RUN.minCount && intensity >= RUN.minIntensity };
    };
    base.positions = POSITIONS.map((pos) => mk('position', pos,
      recent.filter((p) => p.posSet && p.posSet.has(pos)).length, recent.length,
      pool.length ? pool.filter((p) => p.posSet.has(pos)).length / pool.length : 0,
      avail.filter((p) => p.posSet.has(pos) && p.value >= m.starterLine).length));
    const withZ = recent.filter((p) => p.zv);
    base.categories = m.cats.map((c, i) => mk('category', c.label,
      withZ.filter((p) => p.zv[i] >= RUN.strongZ).length, withZ.length,
      pool.length ? pool.filter((p) => p.zv[i] >= RUN.strongZ).length / pool.length : 0,
      avail.filter((p) => p.zv[i] >= RUN.strongZ && p.value >= m.starterLine).length));
    base.runs = base.positions.concat(base.categories).filter((x) => x.isRun).sort((a, b) => b.intensity - a.intensity);
    return base;
  }

  // ------------------------------------------------------------------ Projection uncertainty (Phase 3)
  /**
   * 用「目前模型的同一套尺度」(各類別平均、標準差、聯盟命中率) 替任一數據列計分,回傳 z 向量總和。
   * 缺少任何需要的欄位就回傳 null (不補值、不猜)。比率類別若只有命中率沒有命中數,以 命中率 × 出手數 換算。
   */
  function scoreStatLine(model, line) {
    if (!line) return null;
    let total = 0;
    for (let i = 0; i < model.cats.length; i++) {
      const c = model.cats[i], spec = RATIO_SPECS[c.key], cs = model.catStats[i];
      const row = Object.assign({}, line);
      if (spec) {
        const [made, att] = spec, pctCol = PCT_COL[made];
        if (!isNum(row[made]) && isNum(row[pctCol]) && isNum(row[att])) row[made] = row[pctCol] * row[att];
        if (!isNum(row[made]) || !isNum(row[att])) return null;
      } else if (!isNum(row[c.key])) return null;
      total += (cs.higherBetter ? 1 : -1) * ((catRaw(c, row, model.baselines) - cs.mu) / cs.sd);
    }
    return total;
  }

  /**
   * 季與季之間的實際高低範圍 (estimated,不是統計信賴區間)。
   * 對每位球員,把每個「出賽數 ≥ minGp 且欄位完整」的球季數據,放進同一估值尺度計分,
   * 再套用該球員目前的出勤係數與稀缺加成換成美元。取最低 / 中位 / 最高 = 保守 / 中位 / 樂觀。
   * 少於 2 季可用時標示資料不足,不產生範圍。
   */
  function attachProjectionRange(model, seasons, cfg) {
    const minGp = (cfg && cfg.minGp) || 15;
    const index = (seasons || []).map((s) => ({ label: s.label, byName: new Map((s.players || []).map((p) => [normName(p.name), p])) }));
    model.players.forEach((p) => {
      if (!p.valid) { p.projectionRange = null; return; }
      const pts = [];
      index.forEach((s) => {
        const row = s.byName.get(normName(p.name));
        if (!row || !(isNum(row.gp) && row.gp >= minGp)) return;
        const sc = scoreStatLine(model, row);
        if (sc != null) pts.push({ label: s.label, score: sc });
      });
      if (pts.length < 2) {
        p.projectionRange = { n: pts.length, insufficient: true, source: 'estimated', reason: pts.length ? '只有 1 季可用的數據,無法估計季間範圍。' : '沒有可用的球季數據。' };
        return;
      }
      const sorted = pts.map((x) => x.score).sort((a, b) => a - b);
      const mid = sorted.length % 2 ? sorted[(sorted.length - 1) / 2] : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
      const toTier = (score) => ({ score, dollars: model.toDollars(HM.applyAvailability(score, p.availMult) + p.scarcityBonus) });
      p.projectionRange = {
        n: pts.length, insufficient: false, source: 'estimated', method: 'season-dispersion',
        low: toTier(sorted[0]), median: toTier(mid), high: toTier(sorted[sorted.length - 1]), seasons: pts,
      };
    });
  }

  // ------------------------------------------------------------------ 估值管線服務 (唯一入口)
  /** 跨季比較用的「另一季」:混合模式固定比最新一季;單季模式比「不是目前這季」裡最新的一季。只依上傳順序,不綁年份字串。 */
  function comparisonSeasonIndex(seasons, primaryIdx) {
    if (!seasons || seasons.length < 2) return -1;
    if (primaryIdx === 'blend') return 0;
    return seasons.findIndex((_s, i) => i !== primaryIdx);
  }

  /**
   * 原始資料 → 歷史 (選填混合) → 出勤 → 估值 (稀缺、替補線) → 比較 / 新秀附加。UI 只呼叫這個函式。
   * seasons: [{label, players}] 由新到舊;primaryIdx: 數字索引或 'blend'。
   * 出勤一律用「所有已上傳球季」的 GP 歷史 (規格 §7:出勤是對下一季的預估,與估值用哪一季的數據無關)。
   */
  function buildValuationPipeline(opts) {
    const { seasons, primaryIdx, settings, cfg, rookies, manualGpAdjustments, overrides } = opts;
    if (!seasons || !seasons.length) throw new Error('沒有任何球員資料。');
    const blend = primaryIdx === 'blend';
    const idx = blend ? 0 : clip(Number(primaryIdx) || 0, 0, seasons.length - 1);
    const raw = blend ? HM.blendSeasonsForModel(seasons, normName) : seasons[idx].players.map((p) => Object.assign({}, p));
    const gpMap = Object.assign({}, manualGpAdjustments || {});
    if (overrides && Object.keys(overrides).length) {
      assignStableIds(raw);
      raw.forEach((p) => {
        const o = overrides[p.sid] || overrides[p.nameKey];
        if (o && isNum(o.gpAdjustment) && o.gpAdjustment !== 0) gpMap[normName(p.name)] = o.gpAdjustment;
      });
    }
    HM.attachHistoricalAvailability(raw, seasons, normName, gpMap);
    const model = buildModel(raw, settings, cfg);
    const cmpIdx = comparisonSeasonIndex(seasons, blend ? 'blend' : idx);
    if (cmpIdx >= 0) {
      const cmp = seasons[cmpIdx];
      attachComparison(model, cmp.label, new Map(cmp.players.map((p) => [normName(p.name), p])));
    }
    attachProjectionRange(model, seasons, cfg);
    attachRookiePool(model, rookies || []);
    model.configFingerprint = globalFingerprint(settings, cfg, seasons, primaryIdx, overrides);
    return model;
  }

  /**
   * Snake 最佳人選 = recommend() 的第一名 (相同的篩選與排序:排除 null 與「不選」、依 decisionScore、同分時依可選名單順序)。
   * Snake 的推薦排序不使用 MRV,因此以 lite 模式計算,結果完全相同;由測試逐一比對保證。
   */
  function snakeBestPick(state, cfg, ctx) {
    ctx = ctx || buildContext(state, cfg);
    if (ctx.spots <= 0) return null;   // 與 recommend() 相同:陣容已滿就不推薦
    let best = null;
    for (const p of state.available()) {
      const r = evaluate(state, cfg, ctx, p.pid, { lite: true });
      if (r && !r.doNotDraft && (!best || r.decisionScore > best.decisionScore)) best = r;
    }
    return best;
  }

  /** 對「場上叫價」給結論:cheap / fair / premium / stop */
  function bidVerdict(rec, bid) {
    if (bid == null || !Number.isFinite(bid) || rec.target == null) return null;
    if (bid < rec.target) return 'cheap';
    if (bid < rec.ceiling) return 'premium';
    return 'stop';
  }

  // ------------------------------------------------------------------ 賽前策略報告
  function skew(a) {
    const mu = sum(a) / a.length, sd = Math.sqrt(sum(a.map((x) => (x - mu) ** 2)) / a.length);
    return sd > 0 ? sum(a.map((x) => ((x - mu) / sd) ** 3)) / a.length : 0;
  }
  function strategyReport(state, cfg) {
    const S = state.settings, m = state.model;
    const vp = m.players.filter((p) => p.valid);
    const nAct = activeSlots(S).length, nStarters = S.numTeams * nAct;
    const top = vp.slice(0, nStarters);
    const rep = {
      nSlots: S.numTeams * rosterSize(S), nStarters, nValued: vp.length, replZ: m.replZ, notes: m.notes.slice(),
      scarcity: m.cats.map((c, i) => { const sk = skew(top.map((p) => p.zv[i])); return { label: c.label, skew: sk, tag: sk > 0.6 ? '稀缺' : (sk > 0.1 ? '普通' : '充裕') }; }).sort((a, b) => b.skew - a.skew),
      positions: POSITIONS.map((pos) => {
        const g = top.filter((p) => p.posSet.has(pos));
        return { pos, have: g.length, need: S.rosterSlots[pos] || 0, avg: g.length ? sum(g.map((p) => p.value)) / g.length : NaN };
      }),
      tiers: [], plan: [], rounds: [], targets: [], strategy: cfg.strategy,
      weights: m.cats.map((c) => ({ label: c.label, weight: (cfg.catWeights && cfg.catWeights[c.label] != null) ? Number(cfg.catWeights[c.label]) : 1 })).filter((x) => Math.abs(x.weight - 1) > 1e-9),
    };
    if (S.isAuction) {
      for (const [lo, hi, label] of [[40, 999, '≥ $40'], [25, 40, '$25–39'], [15, 25, '$15–24'], [8, 15, '$8–14'], [4, 8, '$4–7']]) {
        const t = vp.filter((p) => p.dollars >= lo && p.dollars < hi);
        if (t.length) rep.tiers.push({ label, count: t.length, names: t.slice(0, 5).map((p) => p.name) });
      }
      const B = S.budget, sz = rosterSize(S);
      if (cfg.strategy === 'stars_scrubs') {
        const core = Math.round(B * 0.65);
        rep.plan = [`約 $${core} 押 2–3 名頂級球員 (每人約 $${Math.floor(core / 3)}),其餘 ${sz - 3} 人以 $1–3 撿漏。`, '風險:傷病衝擊大;優勢:頂級球員的類別貢獻集中。適合聯盟其他人偏保守時。'];
      } else {
        rep.plan = [`前 3 名核心約 $${Math.round(B * 0.5)} (每人約 $${Math.round(B * 0.5 / 3)});中段 (第 4–8 人) 約 $${Math.round(B * 0.35)};其餘 ${sz - 8} 人約 $${B - Math.round(B * 0.85)} (含 $${S.minBid} 填補)。`];
      }
      rep.plan.push(`永遠保留:每個空位至少 $${S.minBid} → 最高出價 = 剩餘預算 − (空位 − 1) × $${S.minBid}。`);
      rep.plan.push('提名技巧:早期提名「你不想要但大家搶的」球員消耗對手預算;你要的目標,等對手預算下降後再提名。');
    } else {
      for (let r = 1; r <= 4; r++) rep.rounds.push({ round: r, from: (r - 1) * S.numTeams + 1, to: r * S.numTeams, names: vp.slice((r - 1) * S.numTeams, r * S.numTeams).slice(0, 6).map((p) => p.name) });
      rep.plan = ['前兩輪拿高價值、多類別的球員;C 與「稀缺」類別不要拖到中後段。', '後段 (板凳) 優先選有單一稀缺類別專長,或位置彈性大的球員。'];
    }
    rep.targets = m.cats.map((c) => (RATIO_SPECS[c.key] ? { label: c.label, text: m.baselines[c.key].toFixed(3) } : { label: c.label, text: (sum(top.map((p) => p[c.key])) / Math.max(top.length, 1) * nAct).toFixed(1) }));
    return rep;
  }

  // ------------------------------------------------------------------ CSV 匯入
  const ALIASES = {
    name: ['name', 'player', 'playername', 'player_name', 'player name'],
    team: ['team', 'tm'], pos: ['pos', 'position', 'positions'],
    gp: ['gp', 'g', 'games'], min: ['min', 'mpg', 'minutes', 'mp', 'm/g'],
    fgm: ['fgm', 'fg'], fga: ['fga'], ftm: ['ftm', 'ft'], fta: ['fta'],
    tpm: ['3pm', '3ptm', 'tpm', 'fg3m', 'threes', '3p', '3pt', '3/g'], tpa: ['3pa', '3pta', 'tpa', 'fg3a'],
    pts: ['pts', 'points', 'p', 'p/g'], reb: ['reb', 'trb', 'treb', 'rebounds', 'r', 'r/g'],
    oreb: ['oreb', 'orb'], dreb: ['dreb', 'drb'], ast: ['ast', 'assists', 'a', 'a/g'],
    stl: ['stl', 'st', 'steals', 's', 's/g'], blk: ['blk', 'bk', 'blocks', 'b', 'b/g'], tov: ['tov', 'to', 'turnovers', 'to/g'],
    pf: ['pf'], dd: ['dd', 'dd2'], td: ['td', 'td3'], fg_pct: ['fg%', 'fgpct', 'fg_pct'], ft_pct: ['ft%', 'ftpct', 'ft_pct'],
    adp: ['adp', 'avg pick', 'average pick'],
  };
  const COUNT_KEYS = ['min', 'fgm', 'fga', 'ftm', 'fta', 'tpm', 'tpa', 'pts', 'oreb', 'dreb', 'reb', 'ast', 'stl', 'blk', 'tov', 'pf', 'dd', 'td'];
  // 規格 §4.3:League Average / Team Totals 等非球員列,匯入時要整列濾掉,不能被當成球員估值。
  const NON_PLAYER_NAME_RE = /^(league average|team totals?|western conference|eastern conference|total|totals)$/i;

  function parseCSV(text) {

      else if (ch === ',') { row.push(cell); cell = ''; }

      const keep = new Set(Array.from(byName.values()).map((x) => x.p));
      warnings.push(`合併了 ${players.length - byName.size} 列重複的球員 (轉隊球員的分隊資料)。`);
      players.splice(0, players.length, ...players.filter((p) => keep.has(p)));

    if (!players.some((p) => p.pos.length)) warnings.push('CSV 沒有位置欄位 (Pos):位置配對會失效,所有球員視為只能填 UTIL/板凳。建議加入 Pos 欄。');
    return { players, warnings, found: Object.keys(col) };
  }

  // ------------------------------------------------------------------ 選秀模擬 (Phase 5):執行控制
  const WORKER_MAIN = `
self.onmessage = function (ev) {
  var d = ev.data, E = self.Engine;
  try {
    var model = E.buildValuationPipeline({ seasons: d.seasons, primaryIdx: d.primaryIdx, settings: d.settings, cfg: d.cfg, rookies: d.rookies, overrides: d.overrides });
    var st = new E.DraftState(d.settings, model, d.teams, d.myKey);
    st.overrides = d.overrides || {}; st.cfg = d.cfg; st.restorePicks(d.picks);
    var sim = E.createSimulation(st, d.cfg, { runs: d.runs, seed: d.seed, oppBidNoise: d.oppBidNoise });
    var chunk = Math.max(1, Math.round(d.runs / 50));
    while (!sim.done) { sim.step(chunk); self.postMessage({ type: 'progress', completed: sim.completed, total: sim.total }); }
    self.postMessage({ type: 'done', result: sim.result() });
  } catch (e) { self.postMessage({ type: 'error', message: String((e && e.message) || e) }); }
};`;
  function makeSimWorker() {
    if (typeof Worker === 'undefined' || typeof Blob === 'undefined' || !window.URL || !URL.createObjectURL) return null;
    const hm = $('#src-hm'), en = $('#src-engine');
    if (!hm || !en) return null;
    try {
      const url = URL.createObjectURL(new Blob([hm.textContent, '\n', en.textContent, '\n', WORKER_MAIN], { type: 'text/javascript' }));
      const w = new Worker(url);
      w._url = url;
      return w;
    } catch (e) { return null; }
  }
  function simProgress(completed, total) {
    const el = $('#sim-progress'); if (!el || !A.sim) return;
    const elapsed = (Date.now() - A.sim.startedAt) / 1000;
    const eta = completed ? Math.max(0, Math.round(elapsed / completed * (total - completed))) : null;
    el.textContent = `進行中 ${completed} / ${total} 場${eta != null ? `,約剩 ${eta} 秒` : ''} (${A.sim.mode === 'worker' ? '背景執行,可繼續操作' : '分段執行'})`;
  }
  function finishSimulation(result) {
    if (A.sim && A.sim.worker) { A.sim.worker.terminate(); URL.revokeObjectURL(A.sim.worker._url); }
    A.simResult = Object.assign(result, { ranWithPicks: A.sim ? A.sim.picks : null, mode: A.sim ? A.sim.mode : null });
    A.sim = null;
    if (A.ui.tab === 'strategy') renderPane();
    toast(`模擬完成:${result.runs} 場。`);
  }
  function cancelSimulation() {
    if (!A.sim) return;
    if (A.sim.worker) { A.sim.worker.terminate(); URL.revokeObjectURL(A.sim.worker._url); }
    A.sim.cancelled = true; A.sim = null;
    if (A.ui.tab === 'strategy') renderPane();
    toast('已取消模擬。');
  }
  function startSimulation() {
    if (A.sim || !A.state) return;
    const runs = Number(($('#sim-runs') || {}).value) || 100;
    const seedIn = ($('#sim-seed') || {}).value;
    const seed = seedIn !== undefined && seedIn !== '' && Number.isFinite(Number(seedIn)) ? Number(seedIn) >>> 0 : (Date.now() % 2147483647);
    A.ui.simRuns = runs;
    const noiseEl = $('#sim-noise'); const oppBidNoise = noiseEl ? Number(noiseEl.value) : E.SIMULATION.oppBidNoise; A.ui.simNoise = oppBidNoise;
    A.sim = { startedAt: Date.now(), runs, seed, oppBidNoise, picks: A.state.picks.length, mode: 'main' };
    const worker = makeSimWorker();
    if (worker) {
      A.sim.mode = 'worker'; A.sim.worker = worker;
      worker.onmessage = (ev) => {
        const m = ev.data;
        if (m.type === 'progress') simProgress(m.completed, m.total);
        else if (m.type === 'done') finishSimulation(m.result);
        else if (m.type === 'error') { toast('模擬失敗:' + m.message, true); cancelSimulation(); }
      };
      worker.onerror = () => { toast('背景執行失敗,改在主執行緒執行。', true); worker.terminate(); A.sim = null; runOnMainThread(runs, seed, false, oppBidNoise); };
      worker.postMessage({ seasons: A.seasons, primaryIdx: A.primaryIdx, settings: A.settings, cfg: A.cfg, rookies: window.ROOKIE_POOL || [],
        overrides: A.overrides || {}, teams: A.teams, myKey: A.myKey, picks: A.state.picks, runs, seed, oppBidNoise });
    } else runOnMainThread(runs, seed, true, oppBidNoise);
    if (A.ui.tab === 'strategy') renderPane();
  }
  function runOnMainThread(runs, seed, keep, oppBidNoise) {
    if (!keep) A.sim = { startedAt: Date.now(), runs, seed, oppBidNoise, picks: A.state.picks.length, mode: 'main' };
    const me = A.sim, sim = E.createSimulation(A.state, A.cfg, { runs, seed, oppBidNoise });
    const tick = () => {
      if (me.cancelled || A.sim !== me) return;
      sim.step(Math.max(1, Math.round(runs / 50)));
      simProgress(sim.completed, sim.total);
      if (sim.done) finishSimulation(sim.result()); else setTimeout(tick, 0);
    };
    setTimeout(tick, 0);
  }
  function simulationHTML() {
    const S = A.settings, r = A.simResult;

        ${S.isAuction ? `<label class="f" title="對手出價上限 = 預期成交價 × (1 + 常態誤差)。誤差越大,多家競價時成交價越容易高於預期。這是假設,結果對它很敏感。">對手出價誤差 σ<select id="sim-noise">${[0, 0.05, 0.10, 0.15].map((v) => `<option value="${v}" ${Number(A.ui.simNoise == null ? E.SIMULATION.oppBidNoise : A.ui.simNoise) === v ? 'selected' : ''}>${v.toFixed(2)}</option>`).join('')}</select></label>` : ''}
        <label class="f" title="相同種子會得到完全相同的結果;留空則隨機">種子 (選填)<input type="number" id="sim-seed" min="0" step="1" style="width:120px" value=""></label>
        ${A.sim ? '<button class="btn danger" data-act="sim-cancel">取消</button>' : '<button class="btn primary" data-act="sim-run">開始模擬</button>'}
        <span class="hint" id="sim-progress">${A.sim ? '準備中…' : ''}</span></div>`;

      body = `${stale ? '<p class="verdict premium" style="font-weight:500">選秀狀態或設定在模擬之後已經改變,以下結果基於模擬當時的狀態。</p>' : ''}
        <p class="hint">${r.runs} 場 · 種子 ${r.seed} · 從第 ${r.startedAtPick + 1} 手開始 · 估值模型 v${esc(r.modelVersion)} · 決策模型 v${esc(r.decisionVersion)} · ${r.mode === 'worker' ? '背景執行' : '主執行緒'} · ${(r.elapsedMs / 1000).toFixed(1)} 秒</p>

        <div class="advice">

          ${S.isAuction ? `<div><b>${money(my.spent.mean)}</b><span>平均花費 (${money(my.spent.p10)}–${money(my.spent.p90)})</span></div><div><b>${money(my.leftover.mean)}</b><span>平均剩餘預算</span></div>` : ''}

          <div><b>${pct(my.valueRank.rankDist.slice(0, 3).reduce((a, b) => a + b, 0) / r.runs)}</b><span>陣容總價值前 3 名的比例</span></div>
        </div>
