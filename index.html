<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA 選秀助手 — Yahoo Fantasy Basketball</title>
<meta name="color-scheme" content="light dark">
<style>
/* 設計語彙:頁首是一塊球館計分板 (唯一的強調),其餘是安靜的白紙工作區。
   顏色只承載資訊:青綠 = 有利/可行動,磚紅 = 不利/警告,琥珀 = 計分板數字。 */
:root {
  --bg: #ECEFF2; --panel: #FFFFFF; --line: #D3D9E0; --line-2: #E5E9ED;
  --ink: #15202B; --ink-2: #4A5967; --ink-3: #6B7A8C;
  --court: #0B7A75; --court-ink: #FFFFFF; --court-soft: #DDF1EF;
  --brick: #B23A2E; --brick-soft: #F6E1DE; --gold-soft: #FBF0D2; --gold: #8A6100;
  --board: #0D1822; --board-2: #15283A; --board-line: #28405A; --led: #FFC24B; --led-dim: #93A6BA;
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A1016; --panel: #111A24; --line: #243343; --line-2: #1B2734;
    --ink: #E6ECF2; --ink-2: #A9B7C6; --ink-3: #8393A6;
    --court: #3CBDB3; --court-ink: #04211F; --court-soft: #12332F;
    --brick: #E27766; --brick-soft: #3A1E1B; --gold-soft: #33290F; --gold: #E8BE5A;
    --board: #060B10; --board-2: #0E1A26; --board-line: #1E3146;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }

/* ---------- 計分板 ---------- */
.board { background: var(--board); color: #E8EEF5; border-bottom: 1px solid var(--board-line); }
.board-in { max-width: 1560px; margin: 0 auto; padding: 14px 20px 16px; display: grid; gap: 12px; }
.board-top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.board-title { font-size: 18px; font-weight: 700; letter-spacing: .02em; }
.board-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.board-chips .chip { background: var(--board-2); color: var(--led-dim); border-color: var(--board-line); }
.board-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.board .btn { background: transparent; color: #DDE6EF; border-color: var(--board-line); }
.board .btn:hover { background: var(--board-2); }
.board .btn.on { background: var(--led); color: #2A1E00; border-color: var(--led); }
.leds { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.led { background: var(--board-2); border: 1px solid var(--board-line); border-radius: 10px; padding: 8px 14px 9px; }
.led-num { display: block; font: 600 34px/1.1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--led); text-shadow: 0 0 14px rgba(255, 194, 75, .32); letter-spacing: .02em; }
.led-num.warn { color: #FF8C7A; text-shadow: 0 0 14px rgba(255, 120, 100, .3); }
.led-label { color: var(--led-dim); font-size: 12px; }
.sync-note { font-size: 12px; color: var(--led-dim); }
.sync-note.err { color: #FF9C8C; }

/* ---------- 版面 ---------- */
.shell { max-width: 1560px; margin: 0 auto; padding: 16px 20px 40px; display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 16px; align-items: start; }
.shell > main, .col-side { min-width: 0; }
.col-side { position: sticky; top: 12px; display: grid; gap: 14px; max-height: calc(100vh - 24px); overflow-y: auto; padding-right: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 14px 8px; }
.panel-h h2 { font-size: 15px; font-weight: 700; }
.panel-b { padding: 0 14px 14px; }
@media (max-width: 1040px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding: 12px; }
  .col-side { display: contents; }
  #recs { order: 1; } .shell > main { order: 2; } #myteam { order: 3; } #teams { order: 4; }
  .board-in { padding: 12px; }
  .led-num { font-size: 28px; }
}

/* ---------- 按鈕 / 表單 ---------- */
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; line-height: 1.3; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--court); border-color: var(--court); color: var(--court-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--brick); border-color: color-mix(in srgb, var(--brick) 45%, var(--line)); }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.btn.link { border: 0; background: none; padding: 2px 4px; color: var(--court); text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; background: var(--panel); color: var(--ink-2); }
button.chip { cursor: pointer; }
button.chip.on { background: var(--court); border-color: var(--court); color: var(--court-ink); font-weight: 600; }
button.chip.off { background: var(--brick-soft); border-color: transparent; color: var(--brick); }
input[type=text], input[type=number], input[type=search], select, textarea { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 6px 10px; min-width: 0; }
input[type=number] { width: 84px; font-family: var(--font-num); }
textarea { width: 100%; resize: vertical; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.stack { display: grid; gap: 12px; }
.hint { font-size: 12.5px; color: var(--ink-3); }
.tag { display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 12px; line-height: 1.6; background: var(--court-soft); color: var(--court); font-weight: 600; }
.tag.inj { background: var(--brick-soft); color: var(--brick); }
.tag.gold { background: var(--gold-soft); color: var(--gold); }

/* ---------- 分頁 ---------- */
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 8px 14px 9px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tab[aria-selected=true] { color: var(--ink); border-bottom-color: var(--court); font-weight: 700; }

/* ---------- 球員表 ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 12px 14px; }
.filters input[type=search] { width: 220px; }
.tablewrap { overflow: auto; max-height: calc(100vh - 300px); min-height: 260px; border-top: 1px solid var(--line-2); }
table.pl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
table.pl th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); font-weight: 600; color: var(--ink-2); white-space: nowrap; cursor: pointer; user-select: none; }
table.pl th[data-act]:hover { color: var(--ink); }
table.pl th:not([data-act]) { cursor: default; }
table.pl th.l, table.pl td.l { text-align: left; }
table.pl td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); text-align: right; white-space: nowrap; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
table.pl td.l { font-family: var(--font-ui); }
table.pl tbody tr { cursor: pointer; }
table.pl tbody tr:hover td { background: color-mix(in srgb, var(--court) 8%, var(--panel)); }
table.pl tr.gone td { opacity: .45; }
.pn { font-weight: 600; }
.ps { color: var(--ink-3); font-size: 12px; margin-left: 6px; }
.worth { font-weight: 700; color: var(--court); }
.empty { padding: 36px 20px; text-align: center; color: var(--ink-3); }

/* ---------- 推薦 ---------- */
.rec { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.rec + .rec { margin-top: 8px; }
.rec-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.rec-name { font-weight: 700; font-size: 15px; }
.rec-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.rec-price b { font: 700 24px/1 var(--font-num); color: var(--court); }
.rec-price .ceil { color: var(--brick); }
.rec-price small { color: var(--ink-3); }
.rec-why { font-size: 13px; color: var(--ink-2); }
.rec-act { display: flex; gap: 6px; }
.need { font-size: 13px; color: var(--ink-2); padding: 0 0 8px; }

/* ---------- 我的陣容 ---------- */
.slots { display: grid; gap: 4px; }
.slot { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 6px; background: var(--bg); }
.slot .sl { color: var(--ink-3); font-size: 12.5px; font-weight: 600; }
.slot.empty { background: transparent; border: 1px dashed var(--line); }
.slot.empty .sn { color: var(--ink-3); }
.slot.bench { background: transparent; border: 1px solid var(--line-2); }
.bars { display: grid; gap: 5px; margin-top: 12px; }
.bar { display: grid; grid-template-columns: 46px 1fr 44px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar.punt { opacity: .45; }
.track { position: relative; height: 8px; background: var(--bg); border-radius: 4px; }
.track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.fill.pos { left: 50%; background: var(--court); }
.fill.neg { right: 50%; background: var(--brick); }
table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
table.mini th, table.mini td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line-2); }
table.mini th:first-child, table.mini td:first-child { text-align: left; }
table.mini tr.me td { font-weight: 700; color: var(--court); }
details.panel > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel[open] > summary { padding-bottom: 6px; }

/* ---------- 選秀紀錄 / 策略 ---------- */
.log { display: grid; }
.log-i { display: grid; grid-template-columns: 44px 1fr auto auto 32px; gap: 10px; align-items: center; padding: 7px 14px; border-bottom: 1px solid var(--line-2); }
.log-i.me { background: var(--court-soft); }
.pane-pad { padding: 14px; }
.sec { padding: 4px 0 16px; }
.sec h3 { font-size: 15px; margin-bottom: 6px; }
.sec ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 28px; }

/* ---------- 對話框 / 提示 ---------- */
.overlay { position: fixed; inset: 0; background: rgba(6, 12, 18, .55); display: grid; place-items: start center; padding: 5vh 12px; z-index: 50; overflow-y: auto; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: min(640px, 100%); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
.modal.wide { width: min(860px, 100%); }
.modal-h { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 16px 20px 6px; }
.modal-h h2 { font-size: 18px; }
.modal-b { padding: 8px 20px 20px; display: grid; gap: 14px; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink-3); padding: 0 4px; }
.pstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.pst { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.pst b { display: block; font: 600 17px/1.2 var(--font-num); }
.pst span { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.advice { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.advice div { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.advice b { display: block; font: 700 22px/1.2 var(--font-num); }
.advice span { font-size: 12px; color: var(--ink-3); }
.advice .go b { color: var(--court); } .advice .stop b { color: var(--brick); }
.verdict { padding: 8px 12px; border-radius: 8px; font-weight: 600; }
.verdict.cheap { background: var(--court-soft); color: var(--court); }
.verdict.premium { background: var(--gold-soft); color: var(--gold); }
.verdict.stop { background: var(--brick-soft); color: var(--brick); }
.optcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.opt b { display: block; }
.opt[aria-pressed=true] { border-color: var(--court); background: var(--court-soft); }
.slotin { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.catbox { display: flex; flex-wrap: wrap; gap: 6px; }
.catbox label { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.catbox input:checked + span { font-weight: 700; color: var(--court); }
.toasts { position: fixed; left: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 80; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--board); color: #EAF0F6; border: 1px solid var(--board-line); border-left: 4px solid var(--led); padding: 9px 14px; border-radius: 8px; }
.toast.warn { border-left-color: #FF8C7A; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: tin .18s ease-out; }
  @keyframes tin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

</style>
</head>
<body>
<header class="board" id="board"></header>

<div class="shell">
  <main>
    <section class="panel" id="welcome" hidden>
      <div class="empty" style="padding:56px 20px">
        <h2 style="font-size:20px;margin-bottom:8px;color:var(--ink)">還沒有載入資料</h2>
        <p style="margin-bottom:16px">先試玩 Demo,或匯入你的球員 CSV / 連接 Yahoo。</p>
        <button class="btn primary" data-act="open-setup">開始使用</button>
      </div>
    </section>

    <section class="panel" id="workspace" hidden>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-act="tab" data-tab="players" aria-selected="true">球員池</button>
        <button class="tab" role="tab" data-act="tab" data-tab="log" aria-selected="false">選秀紀錄</button>
        <button class="tab" role="tab" data-act="tab" data-tab="strategy" aria-selected="false">賽前策略</button>
      </div>
      <div id="pane-players">
        <div class="filters">
          <input type="search" id="q" placeholder="搜尋球員 (按 / 快速跳到這裡)" aria-label="搜尋球員" autocomplete="off">
          <div id="poschips" class="row" style="gap:4px"></div>
          <label id="aff-wrap" style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" id="f-aff"> 只看買得起</label>
          <label style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" id="f-gone"> 含已選走</label>
          <span class="hint num" id="pl-count"></span>
        </div>
        <div class="tablewrap" id="pl-table"></div>
      </div>
      <div id="pane-log" hidden></div>
      <div id="pane-strategy" hidden></div>
    </section>
  </main>

  <aside class="col-side" id="side" hidden>
    <section class="panel" id="recs"></section>
    <section class="panel" id="myteam"></section>
    <details class="panel" id="teams"></details>
  </aside>
</div>

<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

  function evaluate(state, cfg, ctx, pid) {

    }

    const top = order.slice(0, 3).filter((i) => rec.contrib[i] >= 0.5).map((i) => `${ctx.cats[i].label}${rec.contrib[i] >= 0 ? '+' : ''}${rec.contrib[i].toFixed(1)}`);
    if (top.length) rec.reasons.push('強項 ' + top.join(' '));

    if (weak.length) rec.reasons.push('補強 ' + weak.join('、'));

    if (rec.status && rec.status !== 'NA') rec.reasons.push(`傷病:${rec.status}`);

  function recommend(state, cfg, n) {

    for (const c of rest) { if (chosen.length >= n) break; if (!chosen.includes(c)) chosen.push(c); }
    return { recs: chosen, ctx };
  }

  /** 對「場上叫價」給結論:cheap / fair / premium / stop */

    if (bid < rec.target) return 'cheap';
    if (bid < rec.ceiling) return 'premium';
    return 'stop';
  }

  // ------------------------------------------------------------------ 賽前策略報告
  function skew(a) {
    const mu = sum(a) / a.length, sd = Math.sqrt(sum(a.map((x) => (x - mu) ** 2)) / a.length);
    return sd > 0 ? sum(a.map((x) => ((x - mu) / sd) ** 3)) / a.length : 0;
  }
  function strategyReport(state, cfg) {
    const S = state.settings, m = state.model;
    const vp = m.players.filter((p) => p.valid);
    const nAct = activeSlots(S).length, nStarters = S.numTeams * nAct;
    const top = vp.slice(0, nStarters);
    const rep = {
      nSlots: S.numTeams * rosterSize(S), nStarters, nValued: vp.length, replZ: m.replZ, notes: m.notes.slice(),
      scarcity: m.cats.map((c, i) => { const sk = skew(top.map((p) => p.zv[i])); return { label: c.label, skew: sk, tag: sk > 0.6 ? '稀缺' : (sk > 0.1 ? '普通' : '充裕') }; }).sort((a, b) => b.skew - a.skew),
      positions: POSITIONS.map((pos) => {
        const g = top.filter((p) => p.posSet.has(pos));
        return { pos, have: g.length, need: S.rosterSlots[pos] || 0, avg: g.length ? sum(g.map((p) => p.value)) / g.length : NaN };
      }),
      tiers: [], plan: [], rounds: [], targets: [],
      punt: cfg.puntCats || [], strategy: cfg.strategy,
    };
    if (S.isAuction) {
      for (const [lo, hi, label] of [[40, 999, '≥ $40'], [25, 40, '$25–39'], [15, 25, '$15–24'], [8, 15, '$8–14'], [4, 8, '$4–7']]) {
        const t = vp.filter((p) => p.dollars >= lo && p.dollars < hi);
        if (t.length) rep.tiers.push({ label, count: t.length, names: t.slice(0, 5).map((p) => p.name) });
      }
      const B = S.budget, sz = rosterSize(S);
      if (cfg.strategy === 'stars_scrubs') {
        const core = Math.round(B * 0.65);
        rep.plan = [`約 $${core} 押 2–3 名頂級球員 (每人約 $${Math.floor(core / 3)}),其餘 ${sz - 3} 人以 $1–3 撿漏。`, '風險:傷病衝擊大;優勢:頂級球員的類別貢獻集中。適合聯盟其他人偏保守時。'];
      } else {
        rep.plan = [`前 3 名核心約 $${Math.round(B * 0.5)} (每人約 $${Math.round(B * 0.5 / 3)});中段 (第 4–8 人) 約 $${Math.round(B * 0.35)};其餘 ${sz - 8} 人約 $${B - Math.round(B * 0.85)} (含 $${S.minBid} 填補)。`];
      }
      rep.plan.push(`永遠保留:每個空位至少 $${S.minBid} → 最高出價 = 剩餘預算 − (空位 − 1) × $${S.minBid}。`);
      rep.plan.push('提名技巧:早期提名「你不想要但大家搶的」球員消耗對手預算;你要的目標,等對手預算下降後再提名。');
    } else {
      for (let r = 1; r <= 4; r++) rep.rounds.push({ round: r, from: (r - 1) * S.numTeams + 1, to: r * S.numTeams, names: vp.slice((r - 1) * S.numTeams, r * S.numTeams).slice(0, 6).map((p) => p.name) });
      rep.plan = ['前兩輪拿高價值、多類別的球員;C 與「稀缺」類別不要拖到中後段。', '後段 (板凳) 優先選有單一稀缺類別專長,或位置彈性大的球員。'];
    }
    rep.targets = m.cats.map((c) => (RATIO_SPECS[c.key] ? { label: c.label, text: m.baselines[c.key].toFixed(3) } : { label: c.label, text: (sum(top.map((p) => p[c.key])) / Math.max(top.length, 1) * nAct).toFixed(1) }));
    return rep;
  }

  // ------------------------------------------------------------------ CSV 匯入
  const ALIASES = {
    name: ['name', 'player', 'playername', 'player_name', 'player name'],
    team: ['team', 'tm'], pos: ['pos', 'position', 'positions'],
    gp: ['gp', 'g', 'games'], min: ['min', 'mpg', 'minutes', 'mp', 'm/g'],
    fgm: ['fgm'], fga: ['fga'], ftm: ['ftm'], fta: ['fta'],
    tpm: ['3pm', '3ptm', 'tpm', 'fg3m', 'threes', '3p', '3pt', '3/g'], tpa: ['3pa', '3pta', 'tpa', 'fg3a'],
    pts: ['pts', 'points', 'p', 'p/g'], reb: ['reb', 'trb', 'treb', 'rebounds', 'r', 'r/g'],
    oreb: ['oreb', 'orb'], dreb: ['dreb', 'drb'], ast: ['ast', 'assists', 'a', 'a/g'],
    stl: ['stl', 'st', 'steals', 's', 's/g'], blk: ['blk', 'bk', 'blocks', 'b', 'b/g'], tov: ['tov', 'to', 'turnovers', 'to/g'],
    pf: ['pf'], dd: ['dd', 'dd2'], td: ['td', 'td3'], fg_pct: ['fg%', 'fgpct', 'fg_pct'], ft_pct: ['ft%', 'ftpct', 'ft_pct'],
    adp: ['adp', 'avg pick', 'average pick'],
  };
  const COUNT_KEYS = ['min', 'fgm', 'fga', 'ftm', 'fta', 'tpm', 'tpa', 'pts', 'oreb', 'dreb', 'reb', 'ast', 'stl', 'blk', 'tov', 'pf', 'dd', 'td'];

  function parseCSV(text) {
    text = String(text).replace(/^\uFEFF/, '');
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some((c) => c.trim() !== '')) rows.push(row); row = []; }
      else cell += ch;
    }
    row.push(cell); if (row.some((c) => c.trim() !== '')) rows.push(row);
    return rows;
  }
  const parsePos = (s) => String(s || '').toUpperCase().split(/[^A-Z]+/).filter(Boolean);
  const toNum = (s) => { const v = parseFloat(String(s).replace(/[%,$]/g, '')); return Number.isFinite(v) ? v : null; };

  /** 回傳 {players, warnings, found} */
  function playersFromCSV(text, opts) {
    opts = Object.assign({ perGame: true }, opts || {});
    const rows = parseCSV(text), warnings = [];
    if (rows.length < 2) throw new Error('CSV 沒有資料列。');
    const head = rows[0].map((h) => h.trim().toLowerCase()), col = {};
    for (const [key, names] of Object.entries(ALIASES)) { const i = head.findIndex((h) => names.includes(h)); if (i >= 0) col[key] = i; }
    if (col.name === undefined) throw new Error('CSV 找不到球員姓名欄位 (name / player)。');
    const players = []; let skipped = 0;
    rows.slice(1).forEach((r, idx) => {
      const name = (r[col.name] || '').trim();
      if (!name) { skipped++; return; }
      const p = { pid: `csv:${idx + 1}`, name, team: col.team !== undefined ? (r[col.team] || '').trim() : '', pos: col.pos !== undefined ? parsePos(r[col.pos]) : [], status: '', adp: null };
      for (const k of ['gp', ...COUNT_KEYS, 'fg_pct', 'ft_pct', 'adp']) p[k] = col[k] !== undefined ? toNum(r[col[k]] || '') : null;
      for (const k of ['fg_pct', 'ft_pct']) if (p[k] !== null && p[k] > 1) p[k] /= 100;
      if (!opts.perGame) {
        if (!p.gp) { skipped++; return; }
        COUNT_KEYS.forEach((k) => { if (p[k] !== null) p[k] /= p.gp; });
      }
      players.push(p);
    });
    if (skipped) warnings.push(`略過 ${skipped} 列 (沒有姓名,或累計數據缺少出賽數)。`);
    if (!players.some((p) => p.pos.length)) warnings.push('CSV 沒有位置欄位 (Pos):位置配對會失效,所有球員視為只能填 UTIL/板凳。建議加入 Pos 欄。');
    return { players, warnings, found: Object.keys(col) };
  }

  // ------------------------------------------------------------------ 聯盟預設
  function defaultSettings() {
    return {
      leagueKey: 'local', name: '我的聯盟', numTeams: 12, categories: PRESETS['9-cat'].map(makeCat),
      rosterSlots: { PG: 1, SG: 1, G: 1, SF: 1, PF: 1, F: 1, C: 2, UTIL: 2, BN: 3 },
      isAuction: true, budget: 200, minBid: 1, scoringType: 'head',
    };
  }
  function defaultTeams(n, myIdx, names) {
    return Array.from({ length: n }, (_, i) => ({ key: `t${i + 1}`, name: (names && names[i]) || `隊伍 ${i + 1}`, isMe: i + 1 === myIdx, draftPosition: i + 1 }));
  }
  function defaultCfg() {
    return { strategy: 'balanced', puntCats: [], catWeights: {}, needBeta: 0.5, gpWeight: 0.3, gpRef: 70, minGp: 15, nRecs: 5, pollSeconds: 10, myDraftSlot: null, autoSync: true };
  }

  return {
    CAT_LIBRARY, PRESETS, POSITIONS, RATIO_SPECS, makeCat, normName, isNum, pyRound, activeSlots, benchSlots, rosterSize,
    expandPositions, maxMatch, matchDetail, buildModel, DraftState, buildContext, evaluate, recommend, bidVerdict, nextMyPicks,
    strategyReport, parseCSV, playersFromCSV, defaultSettings, defaultTeams, defaultCfg,
  };
});

<script>
/* 選秀助手網頁介面。計算全部在 engine.js;這裡只負責畫面、輸入與存檔。 */

  const $ = (s, r) => (r || document).querySelector(s);

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (x) => '$' + Math.round(x);

  const A = {
    settings: null, teams: [], myKey: null, playersRaw: [], cfg: E.defaultCfg(), model: null, state: null, ctx: null,

  }
  function load() {
    try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }

  // ------------------------------------------------------------------ 初始化
  function recompute(picks) {
    const prev = picks || (A.state ? A.state.picks : []);
    const model = E.buildModel(A.playersRaw, A.settings, A.cfg);

  // ------------------------------------------------------------------ 橋接 (Yahoo)
  async function fetchJSON(url, ms) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 60000);

      const r = await fetch(url, { cache: 'no-store', signal: ctl.signal });
      const j = await r.json();

    } finally { clearTimeout(t); }
  }
  async function detectBridge() {

  }

  // ------------------------------------------------------------------ 共用顯示
  function toast(msg, warn) {

  }
  function statOf(p, c) {

  }

  }
  function heat(z) {

    el.innerHTML = `<div class="panel-h"><h2>我的陣容</h2><span class="hint num">${my.length}/${E.rosterSize(S)} 人${S.isAuction ? ` 已花 ${money(st.spent(A.myKey))}` : ''}</span></div><div class="panel-b"><div class="slots">${rows.join('')}</div>

  // ------------------------------------------------------------------ 畫面:球員池
  function sortValue(p, ev, key) {
    if (key === 'value') return p.value;
    if (key === 'dollars') return p.dollars;
    if (key === 'worth') return ev ? ev.worth : -1;
    if (key === 'adp') return E.isNum(p.adp) ? -p.adp : -1e9;
    if (key.startsWith('z')) { const i = +key.slice(1); return p.zv ? p.zv[i] : -1e9; }
    return 0;
  }
  function renderPlayers() {
    const st = A.state, S = A.settings, ui = A.ui;
    const cats = st.model.cats, ctx = A.ctx, drafted = new Map(st.picks.map((p) => [p.pid, p]));
    $('#poschips').innerHTML = ['ALL', ...E.POSITIONS, 'G', 'F'].map((p) => `<button class="chip ${ui.pos === p ? 'on' : ''}" data-act="pos" data-pos="${p}">${p === 'ALL' ? '全部' : p}</button>`).join('');
    $('#aff-wrap').hidden = !S.isAuction;
    $('#f-aff').checked = ui.affordable; $('#f-gone').checked = ui.showDrafted;
    const q = E.normName(ui.q);
    let list = st.model.players.filter((p) => p.valid);
    if (!ui.showDrafted) list = list.filter((p) => !drafted.has(p.pid));
    if (q) list = list.filter((p) => E.normName(p.name).includes(q));
    if (ui.pos !== 'ALL') list = list.filter((p) => p.posSet.has(ui.pos));
    if (S.isAuction && ui.affordable) list = list.filter((p) => p.dollars <= ctx.maxBid);
    const evs = new Map(list.filter((p) => !drafted.has(p.pid)).map((p) => [p.pid, E.evaluate(st, A.cfg, ctx, p.pid)]));
    const dir = ui.sort.dir;
    list.sort((a, b) => (sortValue(b, evs.get(b.pid), ui.sort.key) - sortValue(a, evs.get(a.pid), ui.sort.key)) * -dir);
    const shown = list.slice(0, ui.limit);
    const th = (key, label, cls) => key ? `<th class="${cls || ''}" data-act="sort" data-key="${key}" aria-sort="${ui.sort.key === key ? (ui.sort.dir < 0 ? 'descending' : 'ascending') : 'none'}">${label}${ui.sort.key === key ? (ui.sort.dir < 0 ? ' ▼' : ' ▲') : ''}</th>` : `<th class="${cls || ''}">${label}</th>`;
    const head = `<tr>${th(null, '球員', 'l')}${th('value', '價值')}${S.isAuction ? th('dollars', '市價') + th('worth', '對我') : th('adp', 'ADP')}${cats.map((c, i) => th('z' + i, c.label + (isPuntCat(c) ? '×' : ''))).join('')}</tr>`;
    const body = shown.map((p) => {
      const ev = evs.get(p.pid), pk = drafted.get(p.pid);
      const cellsCat = cats.map((c, i) => `<td style="${heat(p.zv[i])}">${fmtStat(statOf(p, c), c)}</td>`).join('');
      return `<tr data-act="open-player" data-pid="${esc(p.pid)}" class="${pk ? 'gone' : ''}"><td class="l"><span class="pn">${esc(p.name)}</span><span class="ps">${esc((p.pos || []).join('/'))} ${esc(p.team || '')}</span>${p.status && p.status !== 'NA' ? `<span class="tag inj">${esc(p.status)}</span>` : ''}${pk ? `<span class="tag">${esc(st.teamName(pk.teamKey))}</span>` : ''}</td>
        <td>${(p.value - st.model.replZ).toFixed(1)}</td>
        ${S.isAuction ? `<td>${money(p.dollars)}</td><td class="worth">${ev ? money(ev.worth) : '–'}</td>` : `<td>${E.isNum(p.adp) ? p.adp.toFixed(0) : '–'}</td>`}${cellsCat}</tr>`;
    }).join('');
    $('#pl-table').innerHTML = shown.length ? `<table class="pl"><thead>${head}</thead><tbody>${body}</tbody></table>${list.length > shown.length ? `<div class="empty"><button class="btn" data-act="more">再顯示 100 筆 (共 ${list.length} 筆符合)</button></div>` : ''}` : '<div class="empty">沒有符合的球員。試試清除搜尋或位置篩選。</div>';
    $('#pl-count').textContent = `${list.length} 名球員`;
  }

  function updateVerdict() {

    const bid = bidEl.value === '' ? null : Number(bidEl.value), verdict = E.bidVerdict(rec, bid);

    v.className = 'verdict ' + verdict; v.hidden = false;
    v.textContent = txt + (bid > maxBid ? ` 注意:超過你的最高可出價 ${money(maxBid)}。` : '');

        <label class="f">球員預測資料 (CSV,場均數據)<input type="file" id="csv-file" accept=".csv,text/csv"></label>
        <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="csv-total"> 檔案是整季累計數據 (程式會除以出賽數 GP)</label>
        <p class="hint">欄位不限順序,可辨識 Player/Pos/GP/PTS/REB/AST/STL/BLK/TOV/FGM/FGA/FTM/FTA/3PM 等常見寫法。<a href="data:text/csv;charset=utf-8,${encodeURIComponent(CSV_TEMPLATE)}" download="projections_template.csv">下載範本</a></p>
        <div class="row"><label class="f">聯盟隊數<input type="number" id="l-teams" min="2" max="30" value="12"></label>
          <label class="f">選秀方式<select id="l-type"><option value="auction">拍賣選秀</option><option value="snake">Snake 選秀</option></select></label>
          <label class="f">預算 (拍賣)<input type="number" id="l-budget" min="10" value="200"></label>
          <label class="f">每人最低出價<input type="number" id="l-min" min="0" value="1"></label>
          <label class="f">我是第幾隊<input type="number" id="l-me" min="1" value="1"></label></div>
        <div class="stack"><b>統計類別</b><div class="row"><button class="btn sm" data-act="preset" data-p="9-cat">9-cat</button><button class="btn sm" data-act="preset" data-p="8-cat">8-cat</button><span class="hint">或自行勾選 (12-cat 等)</span></div><div class="catbox" id="cat-box">${catBoxHTML(E.PRESETS['9-cat'])}</div></div>
        <div class="stack"><b>陣容位置 (每隊)</b><div class="slotin">${['PG', 'SG', 'G', 'SF', 'PF', 'F', 'C', 'UTIL', 'BN'].map((s) => `<label class="f">${s}<input type="number" min="0" max="10" data-slot="${s}" value="${d.rosterSlots[s] || 0}"></label>`).join('')}</div></div>
        <label class="f">隊伍名稱 (選填,每行一隊,順序 = 隊伍編號)<textarea id="l-names" rows="3" placeholder="第 1 行就是隊伍 1 …"></textarea></label>
        <div id="setup-err" class="verdict stop" hidden></div>
        <div class="row"><button class="btn primary" data-act="start-csv">開始選秀</button></div></div>`;
    } else {
      panel = A.bridgeOk
        ? `<div class="stack"><div class="verdict cheap">已偵測到本機橋接程式 (${esc(A.bridgeBase)})。</div><p>會讀取你的 Yahoo 聯盟規則、隊伍和球員資料,並且能自動同步選秀結果。</p><div id="setup-err" class="verdict stop" hidden></div><div class="row"><button class="btn primary" data-act="start-bridge" data-base="${esc(A.bridgeBase)}">從 Yahoo 載入聯盟</button></div></div>`
        : `<div class="stack"><p>瀏覽器無法直接連 Yahoo,需要在你的電腦執行一個小程式當橋樑 (只需開著,不用操作):</p>
          <ol style="margin:0;padding-left:20px;display:grid;gap:4px"><li>開啟命令提示字元,進入專案的 <b>bridge</b> 資料夾。</li><li>執行 <b class="num">python run.py --serve</b></li><li>瀏覽器會自動開啟 <b class="num">http://localhost:8765</b>,那個頁面就是這個工具,會自動連上。</li></ol>
          <p class="hint">如果你是從 GitHub 網頁開啟這個工具,也可以留在這裡,橋接程式啟動後輸入位址連線 (Chrome 詢問「存取本機網路」時請按允許)。</p>
          <div id="setup-err" class="verdict stop" hidden></div><div class="row"><label class="f">橋接位址<input type="text" id="bridge-url" value="${esc(A.bridgeBase || 'http://localhost:8765')}" style="width:260px"></label><button class="btn primary" data-act="connect-bridge">連線</button></div></div>`;
    }
    openModal(`${modalHead(A.state ? '更換資料' : '開始使用', '選一種方式載入球員與聯盟規則')}<div class="modal-b"><div class="optcards">${tabBtn('demo', '先試玩 Demo', '不需要任何資料')}${tabBtn('csv', '匯入我的 CSV', '上傳預測資料 + 設定規則')}${tabBtn('yahoo', '連接 Yahoo', '自動讀取聯盟與選秀')}</div>${panel}</div>`, true);
  }
  function setupError(msg) { const e = $('#setup-err'); if (e) { e.textContent = msg; e.hidden = false; } else toast(msg, true); }
  async function readTextFile(file) {
    const buf = await file.arrayBuffer();
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { try { return new TextDecoder('big5').decode(buf); } catch (e2) { return new TextDecoder('utf-8').decode(buf); } }
  }
  function startDemo(auction) {
    const s = E.defaultSettings(); s.isAuction = auction; s.name = 'Demo 聯盟 (虛構球員)';
    init({ settings: s, teams: E.defaultTeams(12, 1), myKey: 't1', players: window.DEMO_PLAYERS, cfg: { myDraftSlot: 5 }, source: 'demo', picks: [] });
    closeModal(); toast('已載入 Demo。到球員池點任一位球員,就能查價、記錄選秀。');
  }
  async function startCSV() {
    const file = $('#csv-file').files[0]; if (!file) return setupError('請先選擇 CSV 檔案。');
    const n = Number($('#l-teams').value), me = Number($('#l-me').value);
    if (!(n >= 2)) return setupError('隊數至少要 2 隊。');
    if (!(me >= 1 && me <= n)) return setupError(`「我是第幾隊」需在 1 到 ${n} 之間。`);
    let parsed;
    try { parsed = E.playersFromCSV(await readTextFile(file), { perGame: !$('#csv-total').checked }); } catch (e) { return setupError(e.message); }
    const rosterSlots = {}; $$('[data-slot]').forEach((i) => { const v = Number(i.value) || 0; if (v > 0) rosterSlots[i.dataset.slot] = v; });
    if (!Object.keys(rosterSlots).some((k) => !['BN', 'IL'].includes(k))) return setupError('至少需要一個先發位置。');
    const keys = $$('input[name=cat]:checked').map((i) => i.value);
    if (!keys.length) return setupError('請至少勾選一個統計類別。');
    const s = { leagueKey: 'local', name: '我的聯盟', numTeams: n, categories: keys.map(E.makeCat), rosterSlots, isAuction: $('#l-type').value === 'auction', budget: Number($('#l-budget').value) || 200, minBid: Number($('#l-min').value) || 0, scoringType: 'head' };
    const names = $('#l-names').value.split('\n').map((x) => x.trim()).filter(Boolean);
    const prevState = { settings: A.settings, teams: A.teams, myKey: A.myKey, players: A.playersRaw, cfg: A.cfg, source: A.source, picks: A.state ? A.state.picks : [] };
    try { init({ settings: s, teams: E.defaultTeams(n, me, names), myKey: 't' + me, players: parsed.players, cfg: {}, source: 'csv', picks: [] }); }
    catch (e) { if (prevState.settings) init(prevState); return setupError(e.message); }
    closeModal(); toast(`已匯入 ${parsed.players.length} 名球員。`);
    parsed.warnings.concat(A.model.notes).forEach((w) => toast(w, true));
  }

  // ------------------------------------------------------------------ 事件
  const ACTIONS = {
    'open-setup': () => openSetup(), 'open-settings': () => openSettings(), close: () => closeModal(),
    overlay: (t, e) => { if (e.target === t) closeModal(); },
    'setup-tab': (t) => openSetup(t.dataset.tab),
    'start-demo': () => startDemo($('#demo-type').value === 'auction'),
    'start-csv': () => startCSV(),
    'start-bridge': (t) => startBridge(t.dataset.base).catch((e) => setupError('載入失敗:' + e.message)),
    'connect-bridge': async () => {
      const base = $('#bridge-url').value.trim().replace(/\/+$/, '');
      try { const j = await fetchJSON(base + '/api/ping', 4000); if (!j.ok) throw new Error('回應不正確'); A.bridgeBase = base; A.bridgeOk = true; openSetup('yahoo'); }
      catch (e) { setupError('連不到橋接程式:請確認 python run.py --serve 正在執行,位址正確。(' + e.message + ')'); }
    },
    preset: (t) => { const p = E.PRESETS[t.dataset.p]; $$('input[name=cat]').forEach((i) => { i.checked = p.includes(i.value); }); },
    'open-player': (t) => openPlayer(t.dataset.pid),
    'rec-me': (t) => { openPlayer(t.dataset.pid); const s = $('#pk-team'); if (s) s.value = A.myKey; },
    'submit-pick': () => submitPick(),
    'remove-pick': (t) => { const p = A.state.removePick(t.dataset.pid); if (p) { save(); closeModal(); renderAll(); toast(`已撤銷:${A.state.get(p.pid).name}`); } },
    undo: () => { const p = A.state && A.state.undo(); if (p) { save(); renderAll(); toast(`已撤銷:${A.state.get(p.pid).name}`); } else toast('沒有可撤銷的紀錄。'); },
    sync: () => syncNow(false),
    'toggle-auto': () => { A.cfg.autoSync = !A.cfg.autoSync; save(); syncTimerReset(); renderBoard(); },
    tab: (t) => { A.ui.tab = t.dataset.tab; renderPane(); },
    pos: (t) => { A.ui.pos = t.dataset.pos; A.ui.limit = 100; renderPlayers(); },
    sort: (t) => { const k = t.dataset.key; A.ui.sort = A.ui.sort.key === k ? { key: k, dir: -A.ui.sort.dir } : { key: k, dir: -1 }; renderPlayers(); },
    more: () => { A.ui.limit += 100; renderPlayers(); },
    'cfg-strategy': (t) => { A.cfg.strategy = t.dataset.v; $$('[data-act=cfg-strategy]').forEach((b) => b.setAttribute('aria-pressed', String(b === t))); },
    'cfg-punt': (t) => { t.classList.toggle('off'); t.setAttribute('aria-pressed', String(t.classList.contains('off'))); },
    'save-settings': () => saveSettings(),
    export: () => {
      const blob = new Blob([JSON.stringify({ picks: A.state.picks, teams: A.teams, settings: A.settings }, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'draft-progress.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    reset: () => { if (confirm('確定要清除這個瀏覽器裡的所有資料與選秀進度嗎?')) { localStorage.removeItem(LS_KEY); location.reload(); } },
    sim: (t) => {
      const st = A.state, S = A.settings; let made = 0;
      for (let i = 0; i < Number(t.dataset.n); i++) {
        const teams = A.teams.filter((x) => x.key !== A.myKey && st.openSpots(x.key) > 0); if (!teams.length) break;
        const tm = teams[Math.floor(Math.random() * teams.length)], pool = st.available().slice(0, 12), pick = pool[Math.floor(Math.random() * Math.min(6, pool.length))]; if (!pick) break;
        const price = S.isAuction ? Math.max(S.minBid, Math.min(st.maxBid(tm.key), Math.round(pick.dollars * (0.8 + Math.random() * 0.5)))) : 0;
        st.addPick(pick.pid, tm.key, price, 'sim'); made++;
      }
      save(); renderAll(); toast(`模擬了 ${made} 手。`);
    },
  };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const fn = ACTIONS[t.dataset.act]; if (fn) fn(t, e);
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'q') { A.ui.q = t.value; A.ui.limit = 100; if (A.state) renderPlayers(); }
    else if (t.id === 'f-aff') { A.ui.affordable = t.checked; renderPlayers(); }
    else if (t.id === 'f-gone') { A.ui.showDrafted = t.checked; renderPlayers(); }
    else if (t.dataset && t.dataset.role === 'bid') updateVerdict();
    else if (t.id === 'pk-price') t.dataset.touched = '1';
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && A.modal) closeModal();
    else if (e.key === 'Enter' && A.modal && A.modalPid && e.target.id === 'pk-price') { e.preventDefault(); submitPick(); }
    else if (e.key === '/' && !A.modal && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); A.ui.tab = 'players'; renderPane(); const q = $('#q'); if (q) q.focus(); }
  });

  // ------------------------------------------------------------------ 啟動
  async function boot() {
    const saved = load();
    if (saved && saved.settings && saved.players) { A.bridgeBase = saved.bridgeBase || null; }
    await detectBridge();
    if (saved && saved.settings && saved.players) {
      try { init(saved); } catch (e) { toast('讀取先前的進度失敗:' + e.message, true); renderAll(); openSetup(A.bridgeOk ? 'yahoo' : 'demo'); }
    } else { renderAll(); openSetup(A.bridgeOk ? 'yahoo' : 'demo'); }
  }
  window.__app = A; // 供測試與除錯
  boot();
})();

</script>
</body>
</html>
