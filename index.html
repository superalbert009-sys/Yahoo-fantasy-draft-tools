          <div><b>類別 (我方陣容 z 總和)</b><table class="mini"><thead><tr><th>類別</th><th>平均 (p10–p90)</th><th>平均排名</th><th>前 3 名</th></tr></thead><tbody>${cats}</tbody></table></div>
          <div><b>最常取得的球員</b><table class="mini"><thead><tr><th>球員</th><th>取得比例</th>${S.isAuction ? '<th>我方平均成交</th><th>全體平均成交</th>' : '<th>平均順位</th>'}</tr></thead><tbody>${players || '<tr><td class="hint">—</td></tr>'}</tbody></table>

  function renderTeamPanel() {

    const my = st.roster(A.myKey), active = E.activeSlots(S), bench = E.benchSlots(S);
    const { matchSlot } = E.matchDetail(active, my.map((p) => st.get(p.pid).posSet));
    const used = new Set(matchSlot.filter((i) => i >= 0)), rest = my.filter((_p, i) => !used.has(i));
    const cell = (label, pk, cls) => pk
      ? `<div class="slot ${cls || ''}"><span class="sl">${label}</span><span class="sn"><button class="btn link" data-act="open-player" data-pid="${esc(pk.pid)}">${esc(st.get(pk.pid).name)}</button></span><span class="num">${S.isAuction ? money(pk.price) : ''}</span></div>`
      : `<div class="slot empty ${cls || ''}"><span class="sl">${label}</span><span class="sn">空缺</span><span></span></div>`;
    let rows = active.map((slot, si) => cell(slot, matchSlot[si] >= 0 ? my[matchSlot[si]] : null));
    for (let j = 0; j < bench; j++) rows.push(cell('BN', rest[j], 'bench'));
    rest.slice(bench).forEach((pk) => rows.push(cell('超額', pk, 'bench')));
    const sums = st.model.cats.map((_c, i) => sum(my.map((p) => { const z = st.get(p.pid).zv; return z ? z[i] : 0; })));

  // ------------------------------------------------------------------ 畫面:球員池
  function sortValue(p, ev, key) {
    if (key === 'value') return p.value;
    if (key === 'dollars') return p.dollars;
    if (key === 'worth') return ev ? ev.worth : -1;
    if (key === 'adp') return E.isNum(p.adp) ? -p.adp : -1e9;
    if (key.startsWith('z')) { const i = +key.slice(1); return p.zv ? p.zv[i] : -1e9; }
    if (key === 'mpg') return E.isNum(p.min) ? p.min : -1e9;
    return 0;
  }
  function renderPlayers() {
    const st = A.state, S = A.settings, ui = A.ui;
    const cats = st.model.cats, ctx = A.ctx, drafted = new Map(st.picks.map((p) => [p.pid, p]));
    $('#poschips').innerHTML = ['ALL', ...E.POSITIONS, 'G', 'F'].map((p) => `<button class="chip ${ui.pos === p ? 'on' : ''}" data-act="pos" data-pos="${p}">${p === 'ALL' ? '全部' : p}</button>`).join('');
    $('#aff-wrap').hidden = !S.isAuction;
    $('#f-aff').checked = ui.affordable; $('#f-gone').checked = ui.showDrafted;
    const multiSeason = A.seasons.length >= 2;

    if (multiSeason) {
      const rawOpts = A.seasons.map((sn, i) => `<option value="${i}" ${i === A.primaryIdx ? 'selected' : ''}>${esc(sn.label)}</option>`).join('');
      const blendOpt = `<option value="blend" ${isBlendMode() ? 'selected' : ''}>${A.seasons.length} 季歷史混合</option>`;
      $('#f-season').innerHTML = rawOpts + blendOpt;
      $('#f-cmp').checked = ui.showCmp;
    }
    const q = E.normName(ui.q);
    let list = st.model.players.filter((p) => p.valid);
    if (!ui.showDrafted) list = list.filter((p) => !drafted.has(p.pid));
    if (q) list = list.filter((p) => E.normName(p.name).includes(q));
    if (ui.pos !== 'ALL') list = list.filter((p) => p.posSet.has(ui.pos));
    if (S.isAuction && ui.affordable) list = list.filter((p) => p.dollars <= ctx.maxBid);
    const evs = new Map(list.filter((p) => !drafted.has(p.pid)).map((p) => [p.pid, E.evaluate(st, A.cfg, ctx, p.pid)]));
    const dir = ui.sort.dir;
    list.sort((a, b) => (sortValue(b, evs.get(b.pid), ui.sort.key) - sortValue(a, evs.get(a.pid), ui.sort.key)) * -dir);
    const shown = list.slice(0, ui.limit);
    const th = (key, label, cls) => key ? `<th class="${cls || ''}" data-act="sort" data-key="${key}" aria-sort="${ui.sort.key === key ? (ui.sort.dir < 0 ? 'descending' : 'ascending') : 'none'}">${label}${ui.sort.key === key ? (ui.sort.dir < 0 ? ' ▼' : ' ▲') : ''}</th>` : `<th class="${cls || ''}">${label}</th>`;
    const head = `<tr>${th(null, '球員', 'l')}${th('mpg', 'MPG')}${th('value', '價值')}${S.isAuction ? th('dollars', '市價') + th('worth', '對我') : th('adp', 'ADP')}${cats.map((c, i) => { const w = catWeight(c); return th('z' + i, c.label + (w !== 1 ? ` ${weightTag(w)}` : '')); }).join('')}</tr>`;
    const body = shown.map((p) => {
      const ev = evs.get(p.pid), pk = drafted.get(p.pid);
      const cellsCat = cats.map((c, i) => `<td style="${heat(p.zv[i])}">${fmtStat(statOf(p, c), c)}${deltaBadge(statOf(p, c), p.cmp ? statOf(p.cmp, c) : null, c.key, c.higherBetter)}</td>`).join('');
      const mpgCell = (E.isNum(p.min) ? p.min.toFixed(1) : '–') + deltaBadge(p.min, p.cmp ? p.cmp.min : null, 'min', true);
      return `<tr data-act="open-player" data-pid="${esc(p.pid)}" class="${pk ? 'gone' : ''}"><td class="l"><span class="pn">${esc(p.name)}</span><span class="ps">${esc((p.pos || []).join('/'))} ${esc(p.team || '')}</span>${p.status && p.status !== 'NA' ? `<span class="tag inj">${esc(p.status)}</span>` : ''}${pk ? `<span class="tag">${esc(st.teamName(pk.teamKey))}</span>` : ''}${ovTags(E.overrideFor(st, p))}</td>
        <td>${mpgCell}</td>
        <td>${p.aboveRepl.toFixed(1)}</td>
        ${S.isAuction ? `<td>${money(p.dollars)}</td><td class="worth">${ev ? money(ev.worth) : '–'}</td>` : `<td>${E.isNum(p.adp) ? p.adp.toFixed(0) : '–'}</td>`}${cellsCat}</tr>`;
    }).join('');
    $('#pl-table').innerHTML = shown.length ? `<table class="pl"><thead>${head}</thead><tbody>${body}</tbody></table>${list.length > shown.length ? `<div class="empty"><button class="btn" data-act="more">再顯示 100 筆 (共 ${list.length} 筆符合)</button></div>` : ''}` : '<div class="empty">沒有符合的球員。試試清除搜尋或位置篩選。</div>';

  }

  function fmtSL(r) {

    add('pts', 'PTS'); add('reb', 'REB'); add('ast', 'AST'); add('stl', 'STL'); add('blk', 'BLK'); add('tov', 'TOV');
    add('fgPct', 'FG%', true); add('tpPct', '3P%', true); add('ftPct', 'FT%', true);
    const g = E.isNum(sl.games) ? `(${sl.games}戰) ` : '';
    return parts.length ? g + parts.join(' ') : '暫無彙整數據';

    A.modalPid = pid; // openModal() 會先清空,所以要在開啟之後才設定

  function updateVerdict() {
    const rec = A.modalRec, bidEl = $('#bid'), v = $('#verdict'); if (!rec || !bidEl || !v) return;
    const bid = bidEl.value === '' ? null : Number(bidEl.value), verdict = E.bidVerdict(rec, bid);
    if (!verdict) { v.hidden = true; return; }
    const maxBid = A.ctx ? A.ctx.maxBid : Infinity;
    const txt = { cheap: `叫價 ${money(bid)} 低於建議價,可以繼續加。`, premium: `叫價 ${money(bid)} 進入溢價區 (上限 ${money(rec.ceiling)}),非常需要時再加。`, stop: `叫價 ${money(bid)} 已達上限 ${money(rec.ceiling)},建議放手。` }[verdict];
    v.className = 'verdict ' + verdict; v.hidden = false;
    v.textContent = txt + (bid > maxBid ? ` 注意:超過你的最高可出價 ${money(maxBid)}。` : '');
    const pr = $('#pk-price'); if (pr && !pr.dataset.touched) pr.value = bid;
  }
  function submitPick() {
    const pid = A.modalPid, st = A.state, S = A.settings; if (!pid) return;
    const team = $('#pk-team').value; let price = 0;
    if (S.isAuction) {
      price = Number($('#pk-price').value);
      if (!Number.isFinite(price) || price < 0) return toast('請輸入成交價。', true);
      if (price > st.maxBid(team) && st.openSpots(team) > 0) toast(`注意:超過 ${st.teamName(team)} 的最高可出價 ${money(st.maxBid(team))},仍已記錄。`, true);
    }
    recordPick(pid, team, price);
  }
  function recordPick(pid, team, price) {
    const st = A.state;
    try { st.addPick(pid, team, price); } catch (e) { return toast(e.message, true); }
    if (st.openSpots(team) === 0 && st.roster(team).length > E.rosterSize(A.settings)) toast(`${st.teamName(team)} 名額已超過上限。`, true);
    save(); closeModal(); renderAll();
    toast(`已記錄:${st.get(pid).name} → ${team === A.myKey ? '我' : st.teamName(team)}${A.settings.isAuction ? ' ' + money(price) : ''}`);
  }

  function setupError(msg) { const e = $('#setup-err'); if (e) { e.textContent = msg; e.hidden = false; } else toast(msg, true); }
  async function readTextFile(file) {
    const buf = await file.arrayBuffer();
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { try { return new TextDecoder('big5').decode(buf); } catch (e2) { return new TextDecoder('utf-8').decode(buf); } }
  }
  function startDemo(auction) {
    const s = E.defaultSettings(); s.isAuction = auction; s.name = 'Demo 聯盟 (虛構球員)';
    init({ settings: s, teams: E.defaultTeams(12, 1), myKey: 't1', players: window.DEMO_PLAYERS, cfg: { myDraftSlot: 5 }, source: 'demo', picks: [] });
    closeModal(); toast('已載入 Demo。到球員池點任一位球員,就能查價、記錄選秀。');
  }
  async function startCSV() {
    const slots = [
      { file: '#csv-file', label: '#csv-label', total: '#csv-total', fallback: '本季', required: true },
      { file: '#csv-file-prev', label: '#csv-label-prev', total: '#csv-total-prev', fallback: '上一季', required: false },
      { file: '#csv-file-prev2', label: '#csv-label-prev2', total: '#csv-total-prev2', fallback: '再上一季', required: false },
    ];
    const first = $(slots[0].file).files[0];
    if (!first) return setupError('請先選擇本季 CSV 檔案。');
    const n = Number($('#l-teams').value), me = Number($('#l-me').value);
    if (!(n >= 2)) return setupError('隊數至少要 2 隊。');
    if (!(me >= 1 && me <= n)) return setupError(`「我是第幾隊」需在 1 到 ${n} 之間。`);

    const seasons = [];
    const dataWarnings = [];
    for (const slot of slots) {
      const file = $(slot.file).files[0];
      if (!file) continue;
      const label = $(slot.label).value.trim() || slot.fallback;
      let parsed;
      try {
        parsed = E.playersFromCSV(await readTextFile(file), { perGame: !$(slot.total).checked });
      } catch (e) {
        if (slot.required) return setupError(e.message);
        dataWarnings.push(`「${label}」CSV 讀取失敗,已略過:${e.message}`);
        continue;
      }
      seasons.push({ label, players: parsed.players, warnings: parsed.warnings });
      // 規格 §22.1:資料合法性檢查,只警告不擋匯入 (CSV 難免有雜訊,擋死使用者反而更麻煩)。
      const issues = HM.validatePlayerSeasonData(parsed.players.map((p) => Object.assign({}, p, { season: label })));
      if (issues.length) {
        const shown = issues.slice(0, 3).map((i) => i.message).join('; ');
        dataWarnings.push(`「${label}」資料檢查發現 ${issues.length} 項可能異常 (例如:${shown})${issues.length > 3 ? ' 等' : ''},仍會照常匯入,建議之後回頭確認來源檔案。`);
      }
    }

    const rosterSlots = {}; $$('[data-slot]').forEach((i) => { const v = Number(i.value) || 0; if (v > 0) rosterSlots[i.dataset.slot] = v; });
    if (!Object.keys(rosterSlots).some((k) => !['BN', 'IL'].includes(k))) return setupError('至少需要一個先發位置。');
    const keys = $$('input[name=cat]:checked').map((i) => i.value);
    if (!keys.length) return setupError('請至少勾選一個統計類別。');
    const s = { leagueKey: 'local', name: '我的聯盟', numTeams: n, categories: keys.map(E.makeCat), rosterSlots, isAuction: $('#l-type').value === 'auction', budget: Number($('#l-budget').value) || 200, minBid: Number($('#l-min').value) || 0, scoringType: 'head' };
    const names = $('#l-names').value.split('\n').map((x) => x.trim()).filter(Boolean);
    const prevState = { settings: A.settings, teams: A.teams, myKey: A.myKey, seasons: A.seasons, primaryIdx: A.primaryIdx, cfg: A.cfg, source: A.source, picks: A.state ? A.state.picks : [] };
    try { init({ settings: s, teams: E.defaultTeams(n, me, names), myKey: 't' + me, seasons, primaryIdx: 0, cfg: {}, source: 'csv', picks: [] }); }
    catch (e) { if (prevState.settings) init(prevState); return setupError(e.message); }
    closeModal();
    const others = seasons.slice(1).map((s2) => s2.label);
    toast(`已匯入 ${seasons[0].players.length} 名球員 (${seasons[0].label})${others.length ? ',並載入 ' + others.join('、') + ' 供比較/歷史混合' : ''}。`);
    dataWarnings.forEach((w) => toast(w, true));
    seasons.forEach((s2) => (s2.warnings || []).forEach((w) => toast(`「${s2.label}」: ${w}`, true)));
    A.model.notes.forEach((w) => toast(w, true));
  }

      let pk;
      try { pk = A.settings.isAuction ? A.state.completeAuction() : A.state.completeAuction($('#live-team').value); } catch (e) { return toast(e.message, true); }
      save(); renderAll();
      toast(`已記錄:${A.state.get(pk.pid).name} → ${pk.teamKey === A.myKey ? '我' : A.state.teamName(pk.teamKey)}${A.settings.isAuction ? ' ' + money(pk.price) : ''}`);

    'save-override': (t) => {
      const p = A.state.get(t.dataset.pid); if (!p) return;
      const num = (id) => { const el = $(id); if (!el || el.value === '') return null; const x = Number(el.value); return Number.isFinite(x) ? x : null; };
      const o = { valueAdjustment: num('#ov-value'), gpAdjustment: num('#ov-gp'), targetPrice: num('#ov-target'), priority: $('#ov-priority').value, doNotDraft: $('#ov-dnd').checked };
      const empty = !o.valueAdjustment && !o.gpAdjustment && o.targetPrice == null && o.priority === 'normal' && !o.doNotDraft;
      const prevOv = E.overrideFor(A.state, p);
      if (prevOv && prevOv.key !== p.sid) delete A.overrides[prevOv.key];   // 依姓名對應到的舊鍵改存到穩定身分
      if (empty) delete A.overrides[p.sid]; else A.overrides[p.sid] = Object.keys(o).reduce((acc, k) => (o[k] != null && o[k] !== '' ? Object.assign(acc, { [k]: o[k] }) : acc), {});
      try { recompute(); } catch (e) { return toast(e.message, true); }

    more: () => { A.ui.limit += 100; renderPlayers(); },
    'cfg-strategy': (t) => { A.cfg.strategy = t.dataset.v; $$('[data-act=cfg-strategy]').forEach((b) => b.setAttribute('aria-pressed', String(b === t))); },
    'cfg-resetw': () => { $$('#cw-box .cw-row').forEach((row) => { const inp = row.querySelector('input[type=range]'); inp.value = '1'; const v = row.querySelector('.cw-val'); v.textContent = '1.0×'; v.className = 'cw-val'; }); },
    'save-settings': () => saveSettings(),
    export: () => {
      const blob = new Blob([JSON.stringify({ modelVersion: E.VALUATION_MODEL_VERSION, decisionVersion: E.DECISION_MODEL_VERSION, configFingerprint: A.model.configFingerprint, exportedAt: new Date().toISOString(), picks: A.state.picks, teams: A.teams, settings: A.settings }, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'draft-progress.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    reset: () => { if (confirm('確定要清除這個瀏覽器裡的所有資料與選秀進度嗎?')) { localStorage.removeItem(LS_KEY); location.reload(); } },
    sim: (t) => {
      const r = E.simulatePicks(A.state, A.cfg, Number(t.dataset.n));   // 與 Monte Carlo 相同的對手行為 (heuristic)
      save(); renderAll(); toast(`模擬了 ${r.made} 手。${r.stoppedAtMyTurn ? '輪到你了。' : ''}`);
    },
    'sim-run': () => startSimulation(),
    'sim-cancel': () => cancelSimulation(),
  };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const fn = ACTIONS[t.dataset.act]; if (fn) fn(t, e);
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'q') { A.ui.q = t.value; A.ui.limit = 100; if (A.state) renderPlayers(); }
    else if (t.id === 'rq-input') { A.ui.rq = t.value; if (A.state) renderRookiePool(); }
    else if (t.id === 'live-q') { A.ui.liveQ = t.value; const h = $('#live-hits'); if (h) h.innerHTML = liveHitsHTML(); }
    else if (t.id === 'live-nom') { if (A.state.currentAuction) { A.state.currentAuction.nominatedBy = t.value || null; save(); } }
    else if (t.id === 'f-season') {
      const val = t.value === 'blend' ? 'blend' : Number(t.value);
      if (val !== A.primaryIdx) {
        A.primaryIdx = val;
        try { recompute(); } catch (e) { return toast(e.message, true); }
        save(); renderAll(); toast(`已切換為以「${primaryLabel()}」估值,另一年度變成比較基準。`);
      }
    }
    else if (t.id === 'f-cmp') { A.ui.showCmp = t.checked; renderPlayers(); }
    else if (t.id === 'f-aff') { A.ui.affordable = t.checked; renderPlayers(); }
    else if (t.id === 'f-gone') { A.ui.showDrafted = t.checked; renderPlayers(); }
    else if (t.dataset && t.dataset.act === 'cfg-weight') {
      const w = Number(t.value), row = t.closest('.cw-row'), v = row.querySelector('.cw-val');
      v.textContent = w === 0 ? '放棄' : w.toFixed(1) + '×'; v.className = 'cw-val' + (w === 0 ? ' punt' : w > 1 ? ' boost' : '');
    }
    else if (t.id === 'c-need') { const l = $('#need-label'); if (l) l.textContent = Number(t.value).toFixed(1); }
    else if (t.id === 'c-avail') { const l = $('#avail-label'); if (l) l.textContent = Number(t.value).toFixed(1); }
    else if (t.id === 'c-bench') { const l = $('#bench-label'); if (l) l.textContent = Number(t.value).toFixed(2); }
    else if (t.dataset && t.dataset.role === 'bid') updateVerdict();
    else if (t.id === 'pk-price') t.dataset.touched = '1';
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && A.modal) closeModal();
    else if (e.key === 'Enter' && A.modal && A.modalPid && e.target.id === 'pk-price') { e.preventDefault(); submitPick(); }
    else if (e.key === '/' && !A.modal && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); A.ui.tab = 'players'; renderPane(); const q = $('#q'); if (q) q.focus(); }
  });

  // ------------------------------------------------------------------ 啟動
  async function boot() {
    const saved = load();
    const hasSave = saved && saved.settings && (saved.players || saved.seasons);
    if (hasSave) { A.bridgeBase = saved.bridgeBase || null; }
    await detectBridge();
    if (hasSave) {
      try { init(saved); } catch (e) { toast('讀取先前的進度失敗:' + e.message, true); renderAll(); openSetup(A.bridgeOk ? 'yahoo' : 'demo'); }
    } else { renderAll(); openSetup(A.bridgeOk ? 'yahoo' : 'demo'); }
  }
  window.__app = A; // 供測試與除錯
  boot();
})();

</script>
</body>
</html>
